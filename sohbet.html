<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fff19a">
<link rel="apple-touch-icon" href="ikonlar/apple-touch-icon.png">
<title>Sohbet - Okul Ustası</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="sohbet.css">

<script>
try {
    if (localStorage.getItem("ou-tema") === "dark") {
        document.documentElement.setAttribute("data-tema", "dark");
    }
} catch (e) {}
</script>
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="yeni.css">
</head>

<body>

<header class="ou-ust">
    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <a class="ou-giris" id="topLoginLink" href="giris.html">Giriş Yap</a>
        <div id="topUser">
            <span id="topUserEmail"></span>
            <button type="button" class="ou-cikis" id="logoutButton">Çıkış</button>
        </div>
        <button type="button" class="ou-tema" id="ouTemaDugme" aria-label="Karanlık temaya geç"></button>
    </div>
</header>

<div class="yn-sayfa">

    <h1>Sohbet</h1>

    <div class="yn-kutu" id="girisYok" style="display:none;">
        Sohbet etmek için <a href="giris.html">giriş yapmalısın</a>.
    </div>

    <div class="yn-kutu" id="sohbetAlani" style="display:none;">

        <div class="yn-sohbet" id="duzen">

            <div class="yn-sol">

                <div class="yn-alan">
                    <label for="araInput">Kullanıcı ara</label>
                    <input type="text" id="araInput" maxlength="20" autocomplete="off"
                           placeholder="Kullanıcı adı yaz">
                </div>

                <div class="yn-liste" id="araSonuc"></div>

                <h3 style="margin-top:14px;">Sohbetlerim</h3>
                <div class="yn-liste" id="sohbetListesi"></div>
            </div>

            <div class="yn-sag">

                <button type="button" class="yn-btn ikincil kucuk yn-geri" id="geriBtn">Sohbetlere dön</button>

                <h3 id="sohbetBaslik">Bir sohbet seç</h3>

                <div class="yn-mesajlar" id="mesajlar" aria-live="polite"></div>

                <div class="yn-yaz" id="yazAlani" style="display:none;">
                    <textarea class="yn-girdi" id="mesajInput" maxlength="2000"
                              placeholder="Mesajını yaz" aria-label="Mesaj"></textarea>
                    <button type="button" class="yn-btn" id="gonderBtn">Gönder</button>
                </div>

                <div class="yn-mesaj" id="durum" role="status"></div>
            </div>

        </div>
    </div>
</div>


<script src="sohbet.js"></script>

<script src="ortak.js"></script>
</body>
</html>
