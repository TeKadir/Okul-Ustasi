<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giriş Yap - Sınıf Düzeni ve Güvenlik Bildirimi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="giris.css">

<!-- Ortak tema + panel (ortak.css / ortak.js) -->
<script>
/* Tema tercihi sayfa çizilmeden ÖNCE uygulanır (beyaz parlama olmaz). */
try {
    if (localStorage.getItem("ou-tema") === "dark") {
        document.documentElement.setAttribute("data-tema", "dark");
    }
} catch (e) {}
</script>
<link rel="stylesheet" href="ortak.css">
</head>


<body>

<!-- =====================================================
     ÜST MENÜ (tüm sayfalarda aynı)
===================================================== -->
<header class="ou-ust">

    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <button type="button" class="ou-tema" id="ouTemaDugme"
                aria-label="Karanlık temaya geç"></button>
    </div>

</header>

<div class="container">

    <h1>
        Hesabına Giriş Yap
    </h1>


    <div class="card">

        <div class="auth-tabs" role="tablist" aria-label="Giriş veya kayıt">
            <button type="button" class="auth-tab" id="tabGiris"
                    role="tab" aria-selected="true" aria-controls="panelGiris">Giriş Yap</button>
            <button type="button" class="auth-tab" id="tabKayit"
                    role="tab" aria-selected="false" aria-controls="panelKayit">Kayıt Ol</button>
        </div>

        <!-- Oturum kontrolü sürerken gösterilir -->
        <p id="checkingText" class="small-note">Oturum kontrol ediliyor...</p>

        <div id="authContent">

            <!-- ================= GİRİŞ ================= -->
            <section class="auth-panel" id="panelGiris" role="tabpanel" aria-labelledby="tabGiris">

                <h2>Giriş Yap</h2>

                <form id="girisForm" novalidate>

                    <div class="form-group">
                        <label class="form-label" for="girisEmail">E-posta</label>
                        <input type="email" id="girisEmail" class="input"
                               placeholder="E-posta adresin" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="girisSifre">Şifre</label>
                        <input type="password" id="girisSifre" class="input"
                               placeholder="Şifren" autocomplete="current-password">
                    </div>

                    <div class="auth-buttons">
                        <button type="submit" class="main-button" id="loginButton">
                            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l4 4-4 4M14 12H4"/>
                            </svg>
                            Giriş Yap
                        </button>
                    </div>

                    <div id="girisMesaj" class="form-message" role="status"></div>

                </form>

            </section>


            <!-- ================= KAYIT ================= -->
            <section class="auth-panel" id="panelKayit" role="tabpanel" aria-labelledby="tabKayit" hidden>

                <h2>Kayıt Ol</h2>

                <form id="kayitForm" novalidate>

                    <div class="form-group">
                        <label class="form-label" for="kayitEmail">E-posta</label>
                        <input type="email" id="kayitEmail" class="input"
                               placeholder="E-posta adresin" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="kayitUsername">Kullanıcı adı</label>
                        <input type="text" id="kayitUsername" class="input"
                               placeholder="ör. ahmet_12" maxlength="20"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                        <div class="small-note">
                            3-20 karakter: harf, rakam ve alt çizgi. Sohbette ve içeriklerinde bu ad görünür.
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="kayitSifre">Şifre</label>
                        <input type="password" id="kayitSifre" class="input"
                               placeholder="En az 6 karakter" autocomplete="new-password">
                    </div>

                    <div class="form-group onay-satir">

                        <div class="onay-linkler">
                            <a href="kullanici_sozlesmesi.pdf" target="_blank" rel="noopener">
                                <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>
                                </svg>
                                Kullanıcı Sözleşmesi
                            </a>
                            <a href="kvkk_aydinlatma.pdf" target="_blank" rel="noopener">
                                <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2 2 4-4"/>
                                </svg>
                                KVKK Aydınlatma Metni
                            </a>
                        </div>

                        <button type="button" class="onay-buton" id="onayButon" aria-pressed="false">
                            <span class="onay-kutu" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 12l5 5 9-10"/>
                                </svg>
                            </span>
                            <span>Kullanıcı sözleşmesini ve KVKK aydınlatma metnini okudum ve anladım</span>
                        </button>

                    </div>

                    <div class="auth-buttons">
                        <button type="submit" class="main-button" id="registerButton">
                            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M15 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM4 20c0-3.5 3.6-6 8-6M18 14v6M15 17h6"/>
                            </svg>
                            Kayıt Ol
                        </button>
                    </div>

                    <div id="kayitMesaj" class="form-message" role="status"></div>

                </form>

            </section>

        </div>

    </div>


    <p class="back-link">
        <a href="index.html">
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            Ana sayfaya dön</a>
    </p>

</div>


<script src="giris.js"></script>


<script src="sifre.js"></script>
<script src="ortak.js"></script>

</body>
</html>
