<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takvim - Okul Ustası</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="takvim.css">

<script>
try {
    if (localStorage.getItem("ou-tema") === "dark") {
        document.documentElement.setAttribute("data-tema", "dark");
    }
} catch (e) {}
</script>
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="yeni.css">
</head>

<body>

<header class="ou-ust">
    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <a class="ou-giris" id="topLoginLink" href="giris.html">Giriş Yap</a>
        <div id="topUser">
            <span id="topUserEmail"></span>
            <button type="button" class="ou-cikis" id="logoutButton">Çıkış</button>
        </div>
        <button type="button" class="ou-tema" id="ouTemaDugme" aria-label="Karanlık temaya geç"></button>
    </div>
</header>

<div class="yn-sayfa">

    <h1>Takvimim</h1>

    <div class="yn-kutu" id="girisYok" style="display:none;">
        Takvimi kullanmak için <a href="giris.html">giriş yapmalısın</a>.
    </div>

    <div id="takvimAlani" style="display:none;">

        <div class="yn-kutu">
            <div class="yn-takvim-ust">
                <button type="button" class="yn-btn ikincil kucuk" id="oncekiAy" aria-label="Önceki ay">&lsaquo;</button>
                <strong id="ayBasligi"></strong>
                <button type="button" class="yn-btn ikincil kucuk" id="sonrakiAy" aria-label="Sonraki ay">&rsaquo;</button>
            </div>
            <div class="yn-gun-baslik">
                <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
            </div>
            <div class="yn-gunler" id="gunler"></div>
        </div>

        <div class="yn-kutu">
            <div class="yn-baslik-satir">
                <h2 id="gunBasligi">Seçili gün</h2>
                <button type="button" class="yn-btn" id="yeniEtkinlikBtn">Yeni etkinlik</button>
            </div>
            <div id="etkinlikListesi"></div>
        </div>

        <div class="yn-kutu" id="formKutusu" style="display:none;">
            <h2 id="formBaslik">Yeni etkinlik</h2>

            <div class="yn-alan">
                <label for="fBaslik">Başlık</label>
                <input type="text" id="fBaslik" maxlength="150">
            </div>

            <div class="yn-alan">
                <label for="fTarih">Tarih</label>
                <input type="date" id="fTarih">
            </div>

            <div class="yn-iki">
                <div class="yn-alan">
                    <label for="fBaslangic">Başlangıç saati</label>
                    <input type="time" id="fBaslangic" value="09:00">
                </div>
                <div class="yn-alan">
                    <label for="fBitis">Bitiş saati (isteğe bağlı)</label>
                    <input type="time" id="fBitis">
                </div>
            </div>

            <div class="yn-alan">
                <label for="fAciklama">Açıklama (isteğe bağlı)</label>
                <textarea id="fAciklama" maxlength="2000"></textarea>
            </div>

            <div class="yn-satir">
                <button type="button" class="yn-btn" id="kaydetBtn">Kaydet</button>
                <button type="button" class="yn-btn ikincil" id="vazgecBtn">Vazgeç</button>
            </div>
            <div class="yn-mesaj" id="formMesaj" role="status"></div>
        </div>
    </div>
</div>


<script src="takvim.js"></script>

<script src="ortak.js"></script>
</body>
</html>
