<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fff19a">
<link rel="apple-touch-icon" href="ikonlar/apple-touch-icon.png">

    <title>Ödev - Okul Ustası</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="odev-soru.css">

<!-- Ortak tema + panel (ortak.css / ortak.js) -->
<script>
/* Tema tercihi sayfa çizilmeden ÖNCE uygulanır (beyaz parlama olmaz). */
try {
    if (localStorage.getItem("ou-tema") === "dark") {
        document.documentElement.setAttribute("data-tema", "dark");
    }
} catch (e) {}
</script>
<link rel="stylesheet" href="ortak.css">
</head>

<body class="ou-hatli">

    <!-- =====================================================
     ÜST MENÜ (tüm sayfalarda aynı)
===================================================== -->
<header class="ou-ust">

    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <a class="ou-giris" id="topLoginLink" href="giris.html">Giriş Yap</a>

        <div id="topUser">
            <span id="topUserEmail"></span>
            <button type="button" class="ou-cikis" id="logoutButton">Çıkış</button>
        </div>

        <button type="button" class="ou-tema" id="ouTemaDugme"
                aria-label="Karanlık temaya geç"></button>
    </div>

</header>


    <main class="sayfa">

        <!-- =================================================
             BAŞLIK
        ================================================= -->

        <section class="baslik-alani">

            <h1>Ödev</h1>

            <p>
                Ödevini paylaş, takıldığın yeri sor; arkadaşların yardımcı olsun.
            </p>

        </section>


        <!-- =================================================
             GÖNDERİ FORMU
        ================================================= -->

        <!-- Form varsayılan olarak kapalı; bu düğmeyle açılır -->
        <div class="form-ac-satir">
            <button type="button" class="form-ac-buton" id="formAcButonu"
                    aria-expanded="false" aria-controls="formKarti">
                <svg class="ou-svg ac-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <svg class="ou-svg kapa-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
                <span id="formAcYazi" data-kapali="Yeni ödev paylaş" data-acik="Formu kapat">Yeni ödev paylaş</span>
            </button>
        </div>

        <section class="form-karti form-gizli" id="formKarti">

            <h2>Yeni ödev paylaş</h2>

            <div
                id="girisUyarisi"
                class="giris-uyarisi"
                style="display:none;">

                Ödev paylaşmak için
                <a href="giris.html">giriş yapman gerekiyor.</a>

            </div>


            <form id="gonderiFormu">

                <div class="form-grid">

                    <div class="alan">

                        <label for="ders">
                            Ders
                        </label>

                        <select id="ders" required>

                            <option value="">
                                Ders seç
                            </option>

                        </select>

                    </div>


                    <div class="alan">

                        <label for="baslik">
                            Başlık
                        </label>

                        <input
                            id="baslik"
                            type="text"
                            maxlength="150"
                            placeholder="Örn: Sayfa 54, 3. problem"
                            required>

                    </div>


                    <div class="alan tam-alan">

                        <label for="aciklama">
                            Ödev açıklaması
                        </label>

                        <textarea
                            id="aciklama"
                            maxlength="2000"
                            placeholder="Ödevde ne isteniyor, nerede takıldın?"
                            required></textarea>

                    </div>

                    <div class="alan">

                        <label for="teslimTarihi">
                            Teslim tarihi
                        </label>

                        <input
                            id="teslimTarihi"
                            type="date"
                            required>

                    </div>


                    <div class="alan">

                        <label for="gorselSec">
                            Fotoğraf (isteğe bağlı)
                        </label>

                        <label class="foto-sec-buton" for="gorselSec">
                            <svg class="ou-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg> Fotoğraf ekle
                        </label>

                        <input
                            id="gorselSec"
                            class="foto-input"
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            multiple>

                        <span class="foto-not">
                            En fazla 3 fotoğraf. JPG, PNG veya WEBP.
                        </span>

                        <div
                            id="onizleme"
                            class="onizleme">
                        </div>

                    </div>



                </div>


                <div class="form-alt">

                    <span
                        id="karakterSayisi"
                        class="karakter">
                        0 / 2000
                    </span>

                    <button
                        id="gonderButonu"
                        class="gonder-buton"
                        type="submit">
                        Ödevi Paylaş
                    </button>

                </div>


                <div
                    id="formMesaji"
                    class="mesaj">
                </div>

            </form>

        </section>


        <!-- =================================================
             FİLTRE
        ================================================= -->

        <section class="filtre-karti">

            <select id="filtreDers">

                <option value="">
                    Tüm dersler
                </option>

            </select>


            <input
                id="filtreArama"
                type="search"
                maxlength="100"
                placeholder="Başlık veya açıklamada ara...">


            <button
                id="araButonu"
                class="ara-buton">
                Ara
            </button>

        </section>


        <!-- =================================================
             LİSTE
        ================================================= -->

        <section>

            <div class="liste-baslik">

                <h2>Ödevler</h2>

                <span id="listeDurumu"></span>

            </div>


            <div
                id="gonderiListesi">

                <div class="yukleniyor">
                    Ödevler yükleniyor...
                </div>

            </div>


            <div class="sayfalama">

                <button
                    id="dahaButonu"
                    class="daha-buton"
                    style="display:none;">
                    Daha Fazla
                </button>

            </div>

        </section>

    </main>


<div id="buyukFoto" class="buyuk-foto" role="dialog" aria-label="Fotoğraf"><img id="buyukFotoImg" alt="Ödev fotoğrafı"></div>

<script src="odev-soru.js"></script>


<script src="form-ac.js"></script>
<script src="ortak.js"></script>

</body>
</html>
