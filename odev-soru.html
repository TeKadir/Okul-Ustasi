<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ödev - Okul Ustası</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --vurgu: #fff19a;
            --vurgu-koyu: #e5cf4c;
            --mavi: #3b82f6;
            --kirmizi: #ef4444;
            --yesil: #22c55e;
            --metin: #222;
            --sol-cizgi: #e79b9b;
            --kagit: #fffdf5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    to right,
                    transparent 0,
                    transparent 65px,
                    rgba(231, 155, 155, 0.7) 66px,
                    transparent 67px
                ),
                repeating-linear-gradient(
                    to bottom,
                    var(--kagit) 0px,
                    var(--kagit) 31px,
                    #c9d8e6 32px
                );

            font-family: "Comic Sans MS", "Segoe Print", cursive;
            color: var(--metin);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           ÜST BAR
        ===================================================== */

        .ust-bar {
            width: 100%;
            padding: 18px 30px 18px 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #222;

            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            text-decoration: none;
            color: #222;
            font-size: 25px;
            font-weight: bold;
        }

        .ust-sag {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kullanici-yazisi {
            font-size: 14px;
        }

        .ust-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 13px;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .ust-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #222;
        }

        .cikis-buton {
            border: 2px solid #222;
            background: #ffd7d7;
            padding: 7px 13px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           ANA ALAN
        ===================================================== */

        .sayfa {
            width: min(1100px, calc(100% - 40px));
            margin: 35px auto 70px;
        }

        .baslik-alani {
            margin-bottom: 25px;
        }

        .baslik-alani h1 {
            margin: 0;
            display: inline-block;

            background: var(--vurgu);
            padding: 8px 18px;

            font-size: clamp(28px, 5vw, 44px);
            transform: rotate(-1deg);

            border: 2px solid #222;
            box-shadow: 5px 5px 0 #222;
        }

        .baslik-alani p {
            margin: 18px 0 0;
            font-size: 17px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 22px;

            box-shadow: 6px 6px 0 #222;
            margin-bottom: 30px;
        }

        .form-karti h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .giris-uyarisi {
            background: #fff3cd;
            border: 2px dashed #9a7b00;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 8px;
        }

        .giris-uyarisi a {
            color: #1d4ed8;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 15px;
        }

        .alan {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alan label {
            font-weight: bold;
        }

        .alan input,
        .alan textarea,
        .alan select {
            width: 100%;
            border: 2px solid #222;
            border-radius: 7px;
            background: #fffef8;
            padding: 10px 12px;
            outline: none;
        }

        .alan input:focus,
        .alan textarea:focus,
        .alan select:focus {
            box-shadow: 3px 3px 0 var(--vurgu-koyu);
        }

        .tam-alan {
            grid-column: 1 / -1;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-alt {
            margin-top: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .karakter {
            font-size: 13px;
            color: #555;
        }

        .gonder-buton {
            border: 2px solid #222;
            background: var(--vurgu);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .gonder-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #222;
        }

        .gonder-buton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .mesaj {
            margin-top: 15px;
            padding: 10px 13px;
            border-radius: 7px;
            display: none;
        }

        .mesaj.basari {
            display: block;
            background: #dcfce7;
            border: 2px solid #166534;
        }

        .mesaj.hata {
            display: block;
            background: #fee2e2;
            border: 2px solid #991b1b;
        }

        /* =====================================================
           ARAMA / FİLTRE
        ===================================================== */

        .filtre-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 18px;
            margin-bottom: 25px;

            display: grid;
            grid-template-columns: 220px 1fr auto;
            gap: 12px;

            box-shadow: 4px 4px 0 #222;
        }

        .filtre-karti select,
        .filtre-karti input {
            width: 100%;
            border: 2px solid #222;
            padding: 9px 11px;
            border-radius: 7px;
            background: white;
        }

        .ara-buton {
            border: 2px solid #222;
            background: #dbeafe;
            padding: 9px 18px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           GÖNDERİLER
        ===================================================== */

        .liste-baslik {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            margin-bottom: 15px;
        }

        .liste-baslik h2 {
            margin: 0;
            font-size: 27px;
        }

        .yukleniyor {
            padding: 30px;
            text-align: center;
            font-size: 18px;
        }

        .bos-liste {
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #555;
            padding: 30px;
            text-align: center;
            font-size: 17px;
        }

        .gonderi {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #222;

            border-left: 8px solid #f1d84b;

            padding: 20px;
            margin-bottom: 20px;

            box-shadow: 4px 4px 0 #222;
        }

        .gonderi-ust {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .gonderi-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .ders-etiket {
            background: var(--vurgu);
            border: 1px solid #222;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .gonderi-tarih {
            color: #666;
            font-size: 13px;
        }

        .gonderi h3 {
            margin: 12px 0 8px;
            font-size: 24px;
            line-height: 1.2;
        }

        .gonderi-aciklama {
            white-space: pre-wrap;
            line-height: 1.6;
            font-family: inherit;
            font-size: 16px;
        }

        .gonderi-alt {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px dashed #999;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .gonderi-sahip {
            font-size: 14px;
            color: #555;
        }

        .gonderi-islemler {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .kucuk-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 11px;
            border-radius: 7px;
            font-size: 14px;
            box-shadow: 2px 2px 0 #222;
        }

        .cevaplari-buton {
            background: #e0f2fe;
        }

        .sil-buton {
            background: #fee2e2;
        }

        /* =====================================================
           CEVAPLAR
        ===================================================== */

        .cevap-alani {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid #222;
        }

        .cevap-alani.acik {
            display: block;
        }

        .cevap-listesi {
            margin-bottom: 18px;
        }

        .cevap {
            background: #fffef8;
            border: 1px solid #aaa;
            border-radius: 7px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .cevap-ust {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .cevap-yazar {
            font-weight: bold;
        }

        .cevap-tarih {
            color: #777;
            font-size: 12px;
        }

        .cevap-metin {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .cevap-sil {
            margin-top: 8px;
            border: 1px solid #991b1b;
            background: #fee2e2;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 12px;
        }

        .cevap-form {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .cevap-form textarea {
            flex: 1;
            min-height: 80px;
        }

        .cevap-gonder {
            border: 2px solid #222;
            background: #dcfce7;
            padding: 9px 15px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .cevap-giris {
            background: #fff3cd;
            border: 1px dashed #9a7b00;
            padding: 10px;
        }

        /* =====================================================
           SAYFALAMA
        ===================================================== */

        .sayfalama {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .daha-buton {
            border: 2px solid #222;
            background: white;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .daha-buton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 750px) {
            .ust-bar {
                padding: 14px 15px;
                flex-direction: column;
                align-items: stretch;
            }

            .ust-sag {
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .sayfa {
                width: calc(100% - 24px);
                margin-top: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .tam-alan {
                grid-column: auto;
            }

            .filtre-karti {
                grid-template-columns: 1fr;
            }

            .gonderi-ust,
            .gonderi-alt {
                flex-direction: column;
                align-items: stretch;
            }

            .gonderi-islemler {
                width: 100%;
            }

            .kucuk-buton {
                flex: 1;
            }

            .cevap-form {
                flex-direction: column;
                align-items: stretch;
            }

            .cevap-gonder {
                width: 100%;
            }
        }


        /* =====================================================
           ÖDEV SAYFASINA ÖZEL: teslim tarihi + fotoğraflar
        ===================================================== */

        .foto-input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
        }

        .foto-sec-buton {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 10px 16px;
            border: 2px dashed #222;
            border-radius: 8px;
            background: #fffef8;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .foto-input:focus-visible + .foto-not,
        .foto-sec-buton:hover {
            background: var(--vurgu);
        }

        .foto-not {
            font-size: 13px;
            color: #555;
        }

        .onizleme {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 10px;
        }

        .onizleme:empty {
            display: none;
        }

        .onizleme-kart {
            position: relative;
            border: 2px solid #222;
            border-radius: 7px;
            overflow: hidden;
            background: #eee;
            aspect-ratio: 1 / 1;
        }

        .onizleme-kart img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .onizleme-sil {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 28px;
            height: 28px;
            border: 2px solid #222;
            border-radius: 50%;
            background: #fee2e2;
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }

        .teslim-etiket {
            background: #e0f2fe;
            border: 1px solid #222;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .teslim-etiket.gecmis {
            background: #fee2e2;
        }

        .ek-alani {
            margin-top: 12px;
        }

        .ek-alani:empty {
            display: none;
        }

        .galeri {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .galeri button {
            padding: 0;
            border: 2px solid #222;
            border-radius: 7px;
            overflow: hidden;
            background: #eee;
            aspect-ratio: 4 / 3;
            cursor: zoom-in;
        }

        .galeri img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .buyuk-foto {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.88);
            cursor: zoom-out;
        }

        .buyuk-foto.acik {
            display: flex;
        }

        .buyuk-foto img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
            background: #000;
        }

        html[data-tema="dark"] .foto-sec-buton {
            background: #15141b;
            color: #ebe8df;
            border-color: #8d8a96;
        }

        html[data-tema="dark"] .foto-sec-buton:hover {
            background: #5c5113;
        }

        html[data-tema="dark"] .foto-not {
            color: #a9a5b3;
        }

        html[data-tema="dark"] .onizleme-kart,
        html[data-tema="dark"] .galeri button {
            border-color: #8d8a96;
            background: #15141b;
        }

        html[data-tema="dark"] .onizleme-sil {
            background: #5a2323;
            color: #ffd9d9;
            border-color: #c85a5a;
        }

        html[data-tema="dark"] .teslim-etiket {
            background: #1f3a5c;
            color: #ebe8df;
            border-color: #8d8a96;
        }

        html[data-tema="dark"] .teslim-etiket.gecmis {
            background: #5a2323;
            color: #ffd9d9;
        }

        @media (max-width: 750px) {

            .foto-sec-buton {
                width: 100%;
            }

            .galeri {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

    </style>

<!-- Ortak tema + panel (ortak.css / ortak.js) -->

        document.documentElement.setAttribute("data-tema", "dark");

} catch (e) {}
</script>

<body class="ou-hatli">

    <!-- =====================================================
     ÜST MENÜ (tüm sayfalarda aynı)
===================================================== -->
<header class="ou-ust">

    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <a class="ou-giris" id="topLoginLink" href="giris.html">Giriş Yap</a>

        <div id="topUser">
            <span id="topUserEmail"></span>
            <button type="button" class="ou-cikis" id="logoutButton">Çıkış</button>
        </div>

        <button type="button" class="ou-tema" id="ouTemaDugme"
                aria-label="Karanlık temaya geç">🌙</button>
    </div>

</header>


    <main class="sayfa">

        <!-- =================================================
             BAŞLIK
        ================================================= -->

        <section class="baslik-alani">

            <h1>Ödev</h1>

            <p>
                Ödevini paylaş, takıldığın yeri sor; arkadaşların yardımcı olsun.
            </p>

        </section>


        <!-- =================================================
             GÖNDERİ FORMU
        ================================================= -->

        <section class="form-karti">

            <h2>Yeni ödev paylaş</h2>

            <div
                id="girisUyarisi"
                class="giris-uyarisi"
                style="display:none;">

                Ödev paylaşmak için
                <a href="giris.html">giriş yapman gerekiyor.</a>

            </div>


            <form id="gonderiFormu">

                <div class="form-grid">

                    <div class="alan">

                        <label for="ders">
                            Ders
                        </label>

                        <select id="ders" required>

                            <option value="">
                                Ders seç
                            </option>

                        </select>

                    </div>


                    <div class="alan">

                        <label for="baslik">
                            Başlık
                        </label>

                        <input
                            id="baslik"
                            type="text"
                            maxlength="150"
                            placeholder="Örn: Sayfa 54, 3. problem"
                            required>

                    </div>


                    <div class="alan tam-alan">

                        <label for="aciklama">
                            Ödev açıklaması
                        </label>

                        <textarea
                            id="aciklama"
                            maxlength="2000"
                            placeholder="Ödevde ne isteniyor, nerede takıldın?"
                            required></textarea>

                    </div>

                    <div class="alan">

                        <label for="teslimTarihi">
                            Teslim tarihi
                        </label>

                        <input
                            id="teslimTarihi"
                            type="date"
                            required>

                    </div>


                    <div class="alan">

                        <label for="gorselSec">
                            Fotoğraf (isteğe bağlı)
                        </label>

                        <label class="foto-sec-buton" for="gorselSec">
                            📷 Fotoğraf ekle
                        </label>

                        <input
                            id="gorselSec"
                            class="foto-input"
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            multiple>

                        <span class="foto-not">
                            En fazla 3 fotoğraf. JPG, PNG veya WEBP.
                        </span>

                        <div
                            id="onizleme"
                            class="onizleme">
                        </div>

                    </div>



                </div>


                <div class="form-alt">

                    <span
                        id="karakterSayisi"
                        class="karakter">
                        0 / 2000
                    </span>

                    <button
                        id="gonderButonu"
                        class="gonder-buton"
                        type="submit">
                        Ödevi Paylaş
                    </button>

                </div>


                <div
                    id="formMesaji"
                    class="mesaj">
                </div>

            </form>

        </section>


        <!-- =================================================
             FİLTRE
        ================================================= -->

        <section class="filtre-karti">

            <select id="filtreDers">

                <option value="">
                    Tüm dersler
                </option>

            </select>


            <input
                id="filtreArama"
                type="search"
                maxlength="100"
                placeholder="Başlık veya açıklamada ara...">


            <button
                id="araButonu"
                class="ara-buton">
                Ara
            </button>

        </section>


        <!-- =================================================
             LİSTE
        ================================================= -->

        <section>

            <div class="liste-baslik">

                <h2>Ödevler</h2>

                <span id="listeDurumu"></span>

            </div>


            <div
                id="gonderiListesi">

                <div class="yukleniyor">
                    Ödevler yükleniyor...
                </div>

            </div>


            <div class="sayfalama">

                <button
                    id="dahaButonu"
                    class="daha-buton"
                    style="display:none;">
                    Daha Fazla
                </button>

            </div>

        </section>

    </main>


<div id="buyukFoto" class="buyuk-foto" role="dialog" aria-label="Fotoğraf"><img id="buyukFotoImg" alt="Ödev fotoğrafı"></div>

<script>
/* =========================================================
   OKUL USTASI - ÖDEV
   Mevcut SQL RPC sistemine göre yazılmıştır.

   KULLANILAN RPC'LER:
   - ders_listesi()
   - gonderileri_getir()
   - gonderi_ekle()
   - gonderi_sil()
   - gonderi_cevaplarini_getir()
   - gonderi_cevap_ekle()
   - gonderi_cevap_sil()
   - is_admin()
   - gonderi_gorsel_ekle()   (yeni)
   - gonderi_ekleri_getir()  (yeni)
   + Storage kovası: odev-gorselleri
========================================================= */


/* =========================================================
   SUPABASE

/*

    Kullanıcıların yazdığı metinler textContent ile ekleniyor.

    const el = document.createElement(tag);

    if (className) {
        el.className = className;

/* =========================================================
   FOTOĞRAFI KÜÇÜLT (telefon fotoğrafları çok büyük olur)
   Canvas ile yeniden çizildiği için konum (EXIF) bilgisi de
   fotoğraftan silinir.
========================================================= */

function gorseliKucult(dosya) {

    return new Promise((coz, red) => {

        const url = URL.createObjectURL(dosya);
        const img = new Image();

        img.onload = () => {

            URL.revokeObjectURL(url);

            const oran = Math.min(
                1,
                MAX_KENAR / Math.max(img.naturalWidth, img.naturalHeight)
            );

            const canvas = document.createElement("canvas");

            canvas.width = Math.max(1, Math.round(img.naturalWidth * oran));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * oran));

            const ctx = canvas.getContext("2d");

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(
                blob => blob
                    ? coz(blob)
                    : red(new Error("Fotoğraf işlenemedi.")),
                "image/jpeg",
                0.85
            );
        };

        img.onerror = () => {

            URL.revokeObjectURL(url);

            red(new Error(
                "Fotoğraf okunamadı. JPG, PNG veya WEBP bir dosya seç."
            ));
        };

        img.src = url;
    });
}


/* Güvenli olmayan (http) bağlantılarda crypto.randomUUID yoktur. */
function uuidUret() {

    const b = new Uint8Array(16);
    crypto.getRandomValues(b);

    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;

    const h = Array.from(b, x => x.toString(16).padStart(2, "0"));

    return (
        h.slice(0, 4).join("") + "-" +
        h.slice(4, 6).join("") + "-" +
        h.slice(6, 8).join("") + "-" +
        h.slice(8, 10).join("") + "-" +
        h.slice(10, 16).join("")
    );
}


async function yuklenenleriSil(yollar) {

    if (!yollar.length) {
        return;
    }

    try {
        await supabaseClient.storage.from(KOVA).remove(yollar);
    } catch (e) {
        console.error("Temizleme hatası:", e);
    }
}


/*
   Her fotoğraf <kullanıcı-id>/<uuid>.jpg yoluna yüklenir.
   Storage politikası sadece kendi klasörüne yüklemeye izin verir.
*/
async function gorselleriYukle() {

    const yollar = [];

    try {

        for (const g of secilenGorseller) {

            const blob = await gorseliKucult(g.dosya);

            if (blob.size > MAX_BOYUT) {
                throw new Error("Fotoğraf çok büyük (en fazla 5 MB).");
            }

            const yol =
                mevcutKullanici.id + "/" + uuidUret() + ".jpg";

            const { error } = await supabaseClient
                .storage
                .from(KOVA)
                .upload(yol, blob, {
                    contentType: "image/jpeg",
                    upsert: false
                });

            if (error) {
                throw error;
            }

            yollar.push(yol);
        }

    } catch (e) {

        await yuklenenleriSil(yollar);
        throw e;
    }

    return yollar;
}


/* gonderi_ekle yeni kaydın id'sini döndürmüyorsa son gönderimizi bulur. */
async function yeniGonderiIdBul(donenVeri, secilenDers, baslikMetni) {

    if (typeof donenVeri === "number") {
        return donenVeri;
    }

    if (typeof donenVeri === "string" && /^\d+$/.test(donenVeri)) {
        return Number(donenVeri);
    }

    if (donenVeri && typeof donenVeri === "object" && donenVeri.id) {
        return donenVeri.id;
    }

    const { data } = await supabaseClient.rpc(
        "gonderileri_getir",
        {
            p_tur: TUR,
            p_ders: secilenDers,
            p_arama: null,
            p_limit: 10,
            p_sayfa: 0
        }
    );

    const bulunan = (Array.isArray(data) ? data : []).find(
        g => g.user_id === mevcutKullanici.id && g.baslik === baslikMetni
    );

    return bulunan ? bulunan.id : null;
}

        const {

        }


        /* 3) Fotoğrafları ödeve bağla (sahiplik sunucuda kontrol edilir) */

        if (yollar.length > 0) {

            try {

                const yeniId = await yeniGonderiIdBul(
                    donenVeri,
                    secilenDers,
                    baslikMetni

                console.error(e);

                fotoHatasi = hataMetni(e);

                await yuklenenleriSil(yollar);
            }
        }


        /* Formu temizle */

        ders.value = "";
        baslik.value = "";
        aciklama.value = "";
        teslimTarihi.value = "";

        karakterSayisi.textContent = "0 / 2000";

                "Ödev paylaşıldı ama fotoğraf eklenemedi: " + fotoHatasi
            );

            mesajGoster("Ödev başarıyla paylaşıldı.", true);
        }


        sayfaNo = 0;

        await gonderileriGetir(false);

        gonderButonu.disabled = false;
        gonderButonu.textContent = "Ödevi Paylaş";
    }
);


/* =========================================================
   TESLİM TARİHİ + FOTOĞRAFLARI KARTLARA YERLEŞTİR
========================================================= */

function teslimYazisi(deger) {

    if (!deger) {
        return null;
    }

    const tamGun = String(deger).length === 10;

    const d = new Date(tamGun ? deger + "T00:00:00" : deger);

    if (isNaN(d.getTime())) {
        return null;
    }

    const bugun = new Date();
    bugun.setHours(0, 0, 0, 0);

    const gecmis = d < bugun;

    return {
        metin:
            "Teslim: " + d.toLocaleDateString("tr-TR") +
            (gecmis ? " (süresi geçti)" : ""),
        gecmis: gecmis
    };
}


function fotoAc(url) {

    buyukFotoImg.src = url;
    buyukFoto.classList.add("acik");
}

function fotoKapat() {

    buyukFoto.classList.remove("acik");
    buyukFotoImg.removeAttribute("src");
}

buyukFoto.addEventListener("click", fotoKapat);

document.addEventListener("keydown", event => {

    if (event.key === "Escape" && buyukFoto.classList.contains("acik")) {
        fotoKapat();
    }
});


async function ekleriDoldur(gonderiler) {

    if (!gonderiler.length) {
        return;
    }

    const idler = gonderiler.map(g => g.id);

    const { data, error } = await supabaseClient.rpc(
        "gonderi_ekleri_getir",
        { p_gonderi_idleri: idler }
    );

    if (error) {

        /* Ek bilgiler gelmezse ödevler yine de listelenir. */
        console.error("Ödev ekleri alınamadı:", error);
        return;
    }

    const ekler = Array.isArray(data) ? data : [];

    /* Tüm fotoğraflar için tek seferde imzalı bağlantı iste. */

    const tumYollar = [];

    ekler.forEach(e => (e.dosya_yollari || []).forEach(y => tumYollar.push(y)));

    const adresler = {};

    if (tumYollar.length > 0 && mevcutKullanici) {

        const { data: imzali, error: imzaHata } = await supabaseClient
            .storage
            .from(KOVA)
            .createSignedUrls(tumYollar, 3600);

        if (imzaHata) {
            console.error("Fotoğraf bağlantısı alınamadı:", imzaHata);
        } else {
            (imzali || []).forEach(i => {
                if (i.signedUrl) {
                    adresler[i.path] = i.signedUrl;
                }
            });
        }
    }

    ekler.forEach(ek => {

        const kart = gonderiListesi.querySelector(
            '[data-gonderi-id="' + ek.gonderi_id + '"]'
        );

        if (!kart) {
            return;
        }

        kart.dataset.yollar = JSON.stringify(ek.dosya_yollari || []);

        /* Teslim tarihi */

        const t = teslimYazisi(ek.teslim_tarihi);
        const meta = kart.querySelector(".gonderi-meta");

        if (t && meta && !meta.querySelector(".teslim-etiket")) {

            meta.insertBefore(
                eleman(
                    "span",
                    "teslim-etiket" + (t.gecmis ? " gecmis" : ""),
                    t.metin
                ),
                meta.children[1] || null
            );
        }

        /* Fotoğraflar */

        const alan = kart.querySelector(".ek-alani");

        if (!alan) {
            return;
        }

        alan.innerHTML = "";

        const gorunenler = (ek.dosya_yollari || [])
            .map(y => adresler[y])
            .filter(Boolean);

        if (gorunenler.length === 0) {

            if ((ek.dosya_yollari || []).length > 0 && !mevcutKullanici) {
                alan.appendChild(
                    eleman(
                        "div",
                        "small-note",
                        "Fotoğrafları görmek için giriş yap."
                    )
                );
            }

            return;
        }

        const galeri = eleman("div", "galeri");

        gorunenler.forEach((url, i) => {

            const dugme = document.createElement("button");
            dugme.type = "button";
            dugme.setAttribute("aria-label", "Fotoğrafı büyüt");

            const img = document.createElement("img");
            img.src = url;
            img.alt = "Ödev fotoğrafı " + (i + 1);
            img.loading = "lazy";

            dugme.appendChild(img);
            dugme.addEventListener("click", () => fotoAc(url));

            galeri.appendChild(dugme);
        });

        alan.appendChild(galeri);
    });
}

========================================================= */

async function gonderileriGetir(devam = false) {

    if (yukleniyor) {
        return;
    }

    yukleniyor = true;


    if (!devam) {

        sayfaNo = 0;

        gonderiListesi.innerHTML = "";

        const yukleniyorYazisi =
            eleman(
                "div",
                "yukleniyor",
                "Ödevler yükleniyor..."
            );

        gonderiListesi.appendChild(
            yukleniyorYazisi
        );
    }


    const secilenDers =
        filtreDers.value || null;

    const arama =
        filtreArama.value.trim() || null;


    const {
        data,
        error
    } = await supabaseClient.rpc(
        "gonderileri_getir",
        {
            p_tur: TUR,

            p_ders: secilenDers,

            p_arama: arama,

            p_limit: SAYFA_BOYUTU,

            p_sayfa: sayfaNo
        }
    );


    yukleniyor = false;


    if (error) {

        console.error(error);

        if (!devam) {
            gonderiListesi.innerHTML = "";
        }

        const hata =
            eleman(
                "div",
                "bos-liste",
                "Ödevler yüklenirken bir hata oluştu: " +
                hataMetni(error)
            );

        gonderiListesi.appendChild(
            hata
        );

        dahaButonu.style.display =
            "none";

        return;
    }


    const gonderiler =
        Array.isArray(data)
            ? data
            : [];


    /*
       İlk sayfadaysak listeyi temizliyoruz.
    */

    if (!devam) {
        gonderiListesi.innerHTML = "";
    }


    if (
        !devam &&
        gonderiler.length === 0
    ) {

        const bos =
            eleman(
                "div",
                "bos-liste",
                "Henüz paylaşılmış bir ödev yok."
            );

        gonderiListesi.appendChild(
            bos
        );

        dahaButonu.style.display =
            "none";

        listeDurumu.textContent =
            "";

        return;
    }


    gonderiler.forEach(
        gonderi => {

            const kart =
                gonderiOlustur(gonderi);

            gonderiListesi.appendChild(
                kart
            );
        }
    );


    /*
       Gelen kayıt sayısı 20 ise
       daha fazla kayıt olabileceğini varsayıyoruz.
    */

    await ekleriDoldur(gonderiler);

    dahaFazlaVar =
        gonderiler.length === SAYFA_BOYUTU;


    if (dahaFazlaVar) {

        dahaButonu.style.display =
            "inline-block";

    } else {

        dahaButonu.style.display =
            "none";
    }


    listeDurumu.textContent =
        gonderiler.length +
        " ödev gösteriliyor";
}


/* =========================================================
   GÖNDERİ KARTI
========================================================= */

function gonderiOlustur(gonderi) {

    const kart =
        eleman(
            "article",
            "gonderi"
        );

    kart.dataset.gonderiId = gonderi.id;


    /* -----------------------------------------------------
       ÜST
    ----------------------------------------------------- */

    const ust =
        eleman(
            "div",
            "gonderi-ust"
        );


    const meta =
        eleman(
            "div",
            "gonderi-meta"
        );


    const dersEtiketi =
        eleman(
            "span",
            "ders-etiket",
            gonderi.ders || "Ders"
        );


    const tarih =
        eleman(
            "span",
            "gonderi-tarih",
            tarihFormatla(
                gonderi.created_at
            )
        );


    meta.appendChild(
        dersEtiketi
    );

    meta.appendChild(
        tarih
    );


    ust.appendChild(
        meta
    );

    kart.appendChild(
        ust
    );


    /* -----------------------------------------------------
       BAŞLIK
    ----------------------------------------------------- */

    const baslikEl =
        eleman(
            "h3",
            null,
            gonderi.baslik
        );

    kart.appendChild(
        baslikEl
    );


    /* -----------------------------------------------------
       AÇIKLAMA
    ----------------------------------------------------- */

    const aciklamaEl =
        eleman(
            "div",
            "gonderi-aciklama",
            gonderi.aciklama
        );

    kart.appendChild(
        aciklamaEl
    );

    /* Teslim tarihi ve fotoğraflar sonradan buraya yerleşir. */
    kart.appendChild(
        eleman("div", "ek-alani")
    );


    /* -----------------------------------------------------
       ALT
    ----------------------------------------------------- */

    const alt =
        eleman(
            "div",
            "gonderi-alt"
        );


    const sahip =
        eleman(
            "span",
            "gonderi-sahip",
            "Paylaşan: " +
            (gonderi.ad || "Kullanıcı")
        );


    const islemler =
        eleman(
            "div",
            "gonderi-islemler"
        );


    /* -----------------------------------------------------
       CEVAPLAR
    ----------------------------------------------------- */

    const cevapButonu =
        eleman(
            "button",
            "kucuk-buton cevaplari-buton",
            "Cevaplar (" +
            Number(gonderi.cevap_sayisi || 0) +
            ")"
        );

    cevapButonu.type = "button";


    const cevapAlani =
        cevapAlaniOlustur(
            gonderi
        );


    cevapButonu.addEventListener(
        "click",
        async () => {

            const acikMi =
                cevapAlani.classList.contains(
                    "acik"
                );


            if (acikMi) {

                cevapAlani.classList.remove(
                    "acik"
                );

                return;
            }


            cevapAlani.classList.add(
                "acik"
            );


            await cevaplariGetir(
                gonderi.id,
                cevapAlani
            );
        }
    );


    islemler.appendChild(
        cevapButonu
    );


    /* -----------------------------------------------------
       SİLME
    ----------------------------------------------------- */

    if (
        mevcutKullanici &&
        (
            gonderi.user_id ===
            mevcutKullanici.id
            ||
            mevcutKullaniciAdminMi
        )
    ) {

        const silButonu =
            eleman(
                "button",
                "kucuk-buton sil-buton",
                "Sil"
            );

        silButonu.type = "button";


        silButonu.addEventListener(
            "click",
            () => {

                gonderiSil(
                    gonderi.id,
                    kart
                );
            }
        );


        islemler.appendChild(
            silButonu
        );
    }


    alt.appendChild(
        sahip
    );

    alt.appendChild(
        islemler
    );

    kart.appendChild(
        alt
    );


    kart.appendChild(
        cevapAlani
    );


    return kart;
}


/* =========================================================
   CEVAP ALANI
========================================================= */

function cevapAlaniOlustur(gonderi) {

    const alan =
        eleman(
            "div",
            "cevap-alani"
        );


    const liste =
        eleman(
            "div",
            "cevap-listesi"
        );


    liste.dataset.cevapListesi =
        "true";


    alan.appendChild(
        liste
    );


    if (!mevcutKullanici) {

        const giris =
            eleman(
                "div",
                "cevap-giris"
            );


        const metin =
            document.createElement("span");


        metin.appendChild(
            document.createTextNode(
                "Cevap yazmak için "
            )
        );


        const link =
            document.createElement("a");

        link.href =
            "giris.html";

        link.textContent =
            "giriş yap";

        metin.appendChild(
            link
        );


        metin.appendChild(
            document.createTextNode(
                "malısın."
            )
        );


        giris.appendChild(
            metin
        );


        alan.appendChild(
            giris
        );


        return alan;
    }


    /* -----------------------------------------------------
       CEVAP FORMU
    ----------------------------------------------------- */

    const form =
        document.createElement("form");

    form.className =
        "cevap-form";


    const textarea =
        document.createElement("textarea");

    textarea.maxLength =
        1000;

    textarea.placeholder =
        "Bu soruya yardımcı ol...";


    const buton =
        eleman(
            "button",
            "cevap-gonder",
            "Cevapla"
        );

    buton.type =
        "submit";


    form.appendChild(
        textarea
    );

    form.appendChild(
        buton
    );


    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const metin =
                textarea.value.trim();


            if (!metin) {

                alert(
                    "Cevap boş bırakılamaz."
                );

                return;
            }


            buton.disabled =
                true;

            buton.textContent =
                "Gönderiliyor...";


            const {
                error
            } = await supabaseClient.rpc(
                "gonderi_cevap_ekle",
                {
                    p_gonderi_id:
                        gonderi.id,

                    p_cevap:
                        metin,

                    p_ust_cevap_id:
                        null
                }
            );


            if (error) {

                alert(
                    hataMetni(error)
                );

                buton.disabled =
                    false;

                buton.textContent =
                    "Cevapla";

                return;
            }


            textarea.value = "";


            await cevaplariGetir(
                gonderi.id,
                alan
            );


            buton.disabled =
                false;

            buton.textContent =
                "Cevapla";
        }
    );


    alan.appendChild(
        form
    );


    return alan;
}


/* =========================================================
   CEVAPLARI GETİR
========================================================= */

async function cevaplariGetir(
    gonderiId,
    cevapAlani
) {

    const liste =
        cevapAlani.querySelector(
            '[data-cevap-listesi="true"]'
        );


    liste.innerHTML =
        "";


    const yukleniyor =
        eleman(
            "div",
            null,
            "Cevaplar yükleniyor..."
        );


    liste.appendChild(
        yukleniyor
    );


    const {
        data,
        error
    } = await supabaseClient.rpc(
        "gonderi_cevaplarini_getir",
        {
            p_gonderi_id:
                gonderiId
        }
    );


    if (error) {

        liste.innerHTML = "";

        liste.appendChild(
            eleman(
                "div",
                null,
                "Cevaplar alınamadı: " +
                hataMetni(error)
            )
        );

        return;
    }


    liste.innerHTML = "";


    const cevaplar =
        Array.isArray(data)
            ? data
            : [];


    if (cevaplar.length === 0) {

        liste.appendChild(
            eleman(
                "div",
                null,
                "Henüz cevap yok. İlk cevabı sen verebilirsin."
            )
        );

        return;
    }


    cevaplar.forEach(
        cevap => {

            const cevapEl =
                cevapOlustur(
                    cevap
                );

            liste.appendChild(
                cevapEl
            );
        }
    );
}


/* =========================================================
   TEK CEVAP
========================================================= */

function cevapOlustur(cevap) {

    const el =
        eleman(
            "div",
            "cevap"
        );


    const ust =
        eleman(
            "div",
            "cevap-ust"
        );


    const yazar =
        eleman(
            "span",
            "cevap-yazar",
            cevap.ad || "Kullanıcı"
        );


    const tarih =
        eleman(
            "span",
            "cevap-tarih",
            tarihFormatla(
                cevap.created_at
            )
        );


    ust.appendChild(
        yazar
    );

    ust.appendChild(
        tarih
    );


    el.appendChild(
        ust
    );


    const metin =
        eleman(
            "div",
            "cevap-metin",
            cevap.cevap
        );


    el.appendChild(
        metin
    );


    /*
       Kendi cevabı veya admin ise silme.
    */

    if (
        mevcutKullanici &&
        (
            cevap.user_id ===
            mevcutKullanici.id
            ||
            mevcutKullaniciAdminMi
        )
    ) {

        const sil =
            eleman(
                "button",
                "cevap-sil",
                "Cevabı Sil"
            );

        sil.type =
            "button";


        sil.addEventListener(
            "click",
            async () => {

                const onay =
                    confirm(
                        "Bu cevabı silmek istediğine emin misin?"
                    );


                if (!onay) {
                    return;
                }


                sil.disabled =
                    true;


                const {
                    error
                } = await supabaseClient.rpc(
                    "gonderi_cevap_sil",
                    {
                        p_id:
                            cevap.id
                    }
                );


                if (error) {

                    alert(
                        hataMetni(error)
                    );

                    sil.disabled =
                        false;

                    return;
                }


                el.remove();
            }
        );


        el.appendChild(
            sil
        );
    }


    return el;
}


/* =========================================================
   GÖNDERİ SİL
========================================================= */

async function gonderiSil(
    id,
    kart
) {

    const onay =
        confirm(
            "Bu ödevi, fotoğraflarını ve cevaplarını silmek istediğine emin misin?"
        );


    if (!onay) {
        return;
    }


    const {
        error
    } = await supabaseClient.rpc(
        "gonderi_sil",
        {
            p_id: id
        }
    );


    if (error) {

        alert(
            hataMetni(error)
        );

        return;
    }


    /* Ödev silindi; dosyaları da kaldır (sahibi veya admin silebilir). */
    try {

        const yollar = JSON.parse(kart.dataset.yollar || "[]");

        if (yollar.length > 0) {
            await supabaseClient.storage.from(KOVA).remove(yollar);
        }

    } catch (e) {
        console.error("Dosya temizleme hatası:", e);
    }

    kart.remove();


    /*
       Liste tamamen boş kaldıysa
       bilgi mesajı göster.
    */

    if (
        gonderiListesi.children.length === 0
    ) {

        gonderiListesi.appendChild(
            eleman(
                "div",
                "bos-liste",
                "Henüz paylaşılmış bir ödev yok."
            )
        );
    }
}


/* =========================================================
   ARAMA
========================================================= */

araButonu.addEventListener(
    "click",
    async () => {

        await gonderileriGetir(
            false
        );
    }
);


/*
   Enter ile arama.
*/

filtreArama.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            araButonu.click();
        }
    }
);


/*
   Ders değişince direkt filtrele.
*/

filtreDers.addEventListener(
    "change",
    async () => {

        await gonderileriGetir(
            false
        );
    }
);


/* =========================================================
   DAHA FAZLA
========================================================= */

dahaButonu.addEventListener(
    "click",
    async () => {

        if (!dahaFazlaVar) {
            return;
        }


        dahaButonu.disabled =
            true;

        dahaButonu.textContent =
            "Yükleniyor...";


        sayfaNo++;


        await gonderileriGetir(
            true
        );


        dahaButonu.disabled =
            false;

        dahaButonu.textContent =
            "Daha Fazla";
    }
);


/* =========================================================
   AUTH DEĞİŞİKLİĞİ
========================================================= */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        const eskiId =
            mevcutKullanici?.id || null;

        const yeniId =
            session?.user?.id || null;


        mevcutKullanici =
            session?.user || null;


        /*
           Kullanıcı gerçekten değiştiyse
           butonları ve silme izinlerini yenile.
        */

        if (
            eskiId !== yeniId
        ) {

            await kullaniciyiGuncelle();

            await gonderileriGetir(false);
        }
    }
);


/* =========================================================
   BAŞLAT
========================================================= */

async function baslat() {

    await kullaniciyiGuncelle();

    await dersListesiniGetir();

    await gonderileriGetir(false);
}


baslat();

</script>
