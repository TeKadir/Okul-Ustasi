<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bildirimler - Okul Ustası</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --vurgu: #fff19a;
            --vurgu-koyu: #e5cf4c;
            --mavi: #3b82f6;
            --kirmizi: #ef4444;
            --yesil: #22c55e;
            --metin: #222;
            --sol-cizgi: #e79b9b;
            --kagit: #fffdf5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    to right,
                    transparent 0,
                    transparent 65px,
                    rgba(231, 155, 155, 0.7) 66px,
                    transparent 67px
                ),
                repeating-linear-gradient(
                    to bottom,
                    var(--kagit) 0px,
                    var(--kagit) 31px,
                    #c9d8e6 32px
                );

            font-family: "Comic Sans MS", "Segoe Print", cursive;
            color: var(--metin);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           ÜST BAR
        ===================================================== */

        .ust-bar {
            width: 100%;
            padding: 18px 30px 18px 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #222;

            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            text-decoration: none;
            color: #222;
            font-size: 25px;
            font-weight: bold;
        }

        .ust-sag {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kullanici-yazisi {
            font-size: 14px;
        }

        .ust-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 13px;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .ust-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #222;
        }

        .cikis-buton {
            border: 2px solid #222;
            background: #ffd7d7;
            padding: 7px 13px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           ANA ALAN
        ===================================================== */

        .sayfa {
            width: min(1100px, calc(100% - 40px));
            margin: 35px auto 70px;
        }

        .baslik-alani {
            margin-bottom: 25px;
        }

        .baslik-alani h1 {
            margin: 0;
            display: inline-block;

            background: var(--vurgu);
            padding: 8px 18px;

            font-size: clamp(28px, 5vw, 44px);
            transform: rotate(-1deg);

            border: 2px solid #222;
            box-shadow: 5px 5px 0 #222;
        }

        .baslik-alani p {
            margin: 18px 0 0;
            font-size: 17px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 22px;

            box-shadow: 6px 6px 0 #222;
            margin-bottom: 30px;
        }

        .form-karti h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .giris-uyarisi {
            background: #fff3cd;
            border: 2px dashed #9a7b00;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 8px;
        }

        .giris-uyarisi a {
            color: #1d4ed8;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 15px;
        }

        .alan {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alan label {
            font-weight: bold;
        }

        .alan input,
        .alan textarea,
        .alan select {
            width: 100%;
            border: 2px solid #222;
            border-radius: 7px;
            background: #fffef8;
            padding: 10px 12px;
            outline: none;
        }

        .alan input:focus,
        .alan textarea:focus,
        .alan select:focus {
            box-shadow: 3px 3px 0 var(--vurgu-koyu);
        }

        .tam-alan {
            grid-column: 1 / -1;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-alt {
            margin-top: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .karakter {
            font-size: 13px;
            color: #555;
        }

        .gonder-buton {
            border: 2px solid #222;
            background: var(--vurgu);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .gonder-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #222;
        }

        .gonder-buton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .mesaj {
            margin-top: 15px;
            padding: 10px 13px;
            border-radius: 7px;
            display: none;
        }

        .mesaj.basari {
            display: block;
            background: #dcfce7;
            border: 2px solid #166534;
        }

        .mesaj.hata {
            display: block;
            background: #fee2e2;
            border: 2px solid #991b1b;
        }

        /* =====================================================
           ARAMA / FİLTRE
        ===================================================== */

        .filtre-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 18px;
            margin-bottom: 25px;

            display: grid;
            grid-template-columns: 220px 1fr auto;
            gap: 12px;

            box-shadow: 4px 4px 0 #222;
        }

        .filtre-karti select,
        .filtre-karti input {
            width: 100%;
            border: 2px solid #222;
            padding: 9px 11px;
            border-radius: 7px;
            background: white;
        }

        .ara-buton {
            border: 2px solid #222;
            background: #dbeafe;
            padding: 9px 18px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           GÖNDERİLER
        ===================================================== */

        .liste-baslik {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            margin-bottom: 15px;
        }

        .liste-baslik h2 {
            margin: 0;
            font-size: 27px;
        }

        .yukleniyor {
            padding: 30px;
            text-align: center;
            font-size: 18px;
        }

        .bos-liste {
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #555;
            padding: 30px;
            text-align: center;
            font-size: 17px;
        }

        .gonderi {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #222;

            border-left: 8px solid #f1d84b;

            padding: 20px;
            margin-bottom: 20px;

            box-shadow: 4px 4px 0 #222;
        }

        .gonderi-ust {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .gonderi-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .ders-etiket {
            background: var(--vurgu);
            border: 1px solid #222;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .gonderi-tarih {
            color: #666;
            font-size: 13px;
        }

        .gonderi h3 {
            margin: 12px 0 8px;
            font-size: 24px;
            line-height: 1.2;
        }

        .gonderi-aciklama {
            white-space: pre-wrap;
            line-height: 1.6;
            font-family: inherit;
            font-size: 16px;
        }

        .gonderi-alt {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px dashed #999;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .gonderi-sahip {
            font-size: 14px;
            color: #555;
        }

        .gonderi-islemler {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .kucuk-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 11px;
            border-radius: 7px;
            font-size: 14px;
            box-shadow: 2px 2px 0 #222;
        }

        .cevaplari-buton {
            background: #e0f2fe;
        }

        .sil-buton {
            background: #fee2e2;
        }

        /* =====================================================
           CEVAPLAR
        ===================================================== */

        .cevap-alani {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid #222;
        }

        .cevap-alani.acik {
            display: block;
        }

        .cevap-listesi {
            margin-bottom: 18px;
        }

        .cevap {
            background: #fffef8;
            border: 1px solid #aaa;
            border-radius: 7px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .cevap-ust {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .cevap-yazar {
            font-weight: bold;
        }

        .cevap-tarih {
            color: #777;
            font-size: 12px;
        }

        .cevap-metin {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .cevap-sil {
            margin-top: 8px;
            border: 1px solid #991b1b;
            background: #fee2e2;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 12px;
        }

        .cevap-form {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .cevap-form textarea {
            flex: 1;
            min-height: 80px;
        }

        .cevap-gonder {
            border: 2px solid #222;
            background: #dcfce7;
            padding: 9px 15px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .cevap-giris {
            background: #fff3cd;
            border: 1px dashed #9a7b00;
            padding: 10px;
        }

        /* =====================================================
           SAYFALAMA
        ===================================================== */

        .sayfalama {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .daha-buton {
            border: 2px solid #222;
            background: white;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .daha-buton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 750px) {
            .ust-bar {
                padding: 14px 15px;
                flex-direction: column;
                align-items: stretch;
            }

            .ust-sag {
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .sayfa {
                width: calc(100% - 24px);
                margin-top: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .tam-alan {
                grid-column: auto;
            }

            .filtre-karti {
                grid-template-columns: 1fr;
            }

            .gonderi-ust,
            .gonderi-alt {
                flex-direction: column;
                align-items: stretch;
            }

            .gonderi-islemler {
                width: 100%;
            }

            .kucuk-buton {
                flex: 1;
            }

            .cevap-form {
                flex-direction: column;
                align-items: stretch;
            }

            .cevap-gonder {
                width: 100%;
            }
        }
    
        /* ---- Bildirimler sayfasına özel ---- */

        .sayi-rozet {
            display: inline-block;
            min-width: 28px;
            margin-left: 8px;
            padding: 1px 9px;
            border: 2px solid #222;
            border-radius: 999px;
            background: #fecaca;
            font-size: 15px;
            text-align: center;
            vertical-align: middle;
        }

        .sayi-rozet:empty {
            display: none;
        }

        .bildirim {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #222;
            border-left: 8px solid #cbd5e1;
            padding: 16px 18px;
            margin-bottom: 14px;
            box-shadow: 3px 3px 0 #222;
        }

        .bildirim.okunmamis {
            border-left-color: #f1d84b;
            background: #fffbe0;
        }

        .bildirim h3 {
            margin: 0 0 6px;
            font-size: 19px;
        }

        .bildirim.okunmamis h3::before {
            content: "● ";
            color: #dc2626;
        }

        .bildirim-mesaj {
            white-space: pre-wrap;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .bildirim-alt {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .bildirim-tarih {
            font-size: 13px;
            color: #666;
        }

        .bildirim-islemler {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bildirim-islemler a.kucuk-buton {
            text-decoration: none;
            color: inherit;
            background: #e0f2fe;
        }

        html[data-tema="dark"] .sayi-rozet {
            background: #5a2323;
            color: #ffd9d9;
            border-color: #c85a5a;
        }

        html[data-tema="dark"] .bildirim {
            background: rgba(39, 38, 49, 0.94);
            border-color: #6f6c7a;
            border-left-color: #55525f;
            box-shadow: 3px 3px 0 #0c0b10;
        }

        html[data-tema="dark"] .bildirim.okunmamis {
            background: #34301a;
            border-left-color: #c9b440;
        }

        html[data-tema="dark"] .bildirim-tarih {
            color: #a9a5b3;
        }

        html[data-tema="dark"] .bildirim-islemler a.kucuk-buton {
            background: #1f3a5c;
            color: #ebe8df;
            border-color: #8d8a96;
        }

        @media (max-width: 750px) {

            .bildirim-alt {
                flex-direction: column;
                align-items: stretch;
            }

            .bildirim-islemler .kucuk-buton {
                flex: 1;
                text-align: center;
            }
        }

    </style>

<script>
/* =========================================================
   OKUL USTASI - BİLDİRİMLER
   Kullanılan RPC'ler (hepsi auth.uid() ile sadece kullanıcının
   KENDİ bildirimlerine erişir):
   - bildirimleri_getir()
   - okunmamis_bildirim_sayisi()
   - bildirim_okundu_isaretle()
   - tum_bildirimleri_okundu_isaretle()
   - bildirim_sil()
========================================================= */

const SUPABASE_URL =
    "https://hinisayolrgyzcoztobi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_76n3XsryMfvfdYwKeUu6SA_TCxImZiW";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const SAYFA_BOYUTU = 20;

let mevcutKullanici = null;
let sayfaNo = 0;
let yukleniyor = false;

const girisUyarisi = document.getElementById("girisUyarisi");
const bildirimBolumu = document.getElementById("bildirimBolumu");
const bildirimListesi = document.getElementById("bildirimListesi");
const okunmamisSayi = document.getElementById("okunmamisSayi");
const hepsiniOkuButonu = document.getElementById("hepsiniOkuButonu");
const dahaButonu = document.getElementById("dahaButonu");


/* =========================================================
   ÜST MENÜ (diğer sayfalarla aynı mantık)
========================================================= */

const topLoginLink = document.getElementById("topLoginLink");
const topUser = document.getElementById("topUser");
const topUserEmail = document.getElementById("topUserEmail");
const logoutButton = document.getElementById("logoutButton");

function ustCubuguGuncelle(session) {

    if (session && session.user) {

        topLoginLink.style.display = "none";
        topUser.style.display = "flex";
        topUserEmail.textContent = session.user.email || "";

    } else {

        topLoginLink.style.display = "inline-block";
        topUser.style.display = "none";
        topUserEmail.textContent = "";
    }
}

logoutButton.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();
});


/* =========================================================
   YARDIMCI
========================================================= */

function eleman(tag, className, text) {

    const el = document.createElement(tag);

    if (className) {
        el.className = className;
    }

    if (text !== undefined) {
        el.textContent = text;
    }

    return el;
}

function hataMetni(error) {

    if (!error) {
        return "Bilinmeyen bir hata oluştu.";
    }

    return error.message || "Bilinmeyen bir hata oluştu.";
}

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    return new Date(tarih).toLocaleString("tr-TR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


/* Sadece site içi sayfa adlarına (ör. odev-soru.html) izin verilir. */
function guvenliBaglanti(baglanti) {

    return typeof baglanti === "string" &&
        /^[a-z0-9-]+\.html$/.test(baglanti);
}


async function sayacGuncelle() {

    const { data, error } = await supabaseClient.rpc(
        "okunmamis_bildirim_sayisi"
    );

    if (error) {
        console.error(error);
        return;
    }

    const sayi = Number(data || 0);

    okunmamisSayi.textContent = sayi > 0 ? String(sayi) : "";

    hepsiniOkuButonu.disabled = sayi === 0;
}


async function okunduYap(id, kart) {

    const { error } = await supabaseClient.rpc(
        "bildirim_okundu_isaretle",
        { p_id: id }
    );

    if (error) {
        console.error(error);
        return false;
    }

    kart.classList.remove("okunmamis");

    const buton = kart.querySelector(".okundu-buton");

    if (buton) {
        buton.remove();
    }

    await sayacGuncelle();

    return true;
}


/* =========================================================
   KART
========================================================= */

function bildirimKarti(b) {

    const kart = eleman(
        "article",
        "bildirim" + (b.okundu ? "" : " okunmamis")
    );

    kart.appendChild(eleman("h3", null, b.baslik));

    if (b.mesaj) {
        kart.appendChild(eleman("div", "bildirim-mesaj", b.mesaj));
    }

    const alt = eleman("div", "bildirim-alt");

    alt.appendChild(
        eleman("span", "bildirim-tarih", tarihFormatla(b.created_at))
    );

    const islemler = eleman("div", "bildirim-islemler");

    if (guvenliBaglanti(b.baglanti)) {

        const ac = eleman("a", "kucuk-buton", "Aç");
        ac.href = b.baglanti;

        ac.addEventListener("click", async event => {

            if (!b.okundu && kart.classList.contains("okunmamis")) {

                event.preventDefault();

                await okunduYap(b.id, kart);

                window.location.href = b.baglanti;
            }
        });

        islemler.appendChild(ac);
    }

    if (!b.okundu) {

        const okundu = eleman(
            "button",
            "kucuk-buton okundu-buton",
            "Okundu"
        );

        okundu.type = "button";

        okundu.addEventListener("click", () => okunduYap(b.id, kart));

        islemler.appendChild(okundu);
    }

    const sil = eleman("button", "kucuk-buton sil-buton", "Sil");
    sil.type = "button";

    sil.addEventListener("click", async () => {

        const { error } = await supabaseClient.rpc(
            "bildirim_sil",
            { p_id: b.id }
        );

        if (error) {
            alert(hataMetni(error));
            return;
        }

        kart.remove();

        if (bildirimListesi.children.length === 0) {
            bildirimListesi.appendChild(
                eleman("div", "bos-liste", "Hiç bildirimin yok.")
            );
        }

        await sayacGuncelle();
    });

    islemler.appendChild(sil);

    alt.appendChild(islemler);
    kart.appendChild(alt);

    return kart;
}


/* =========================================================
   LİSTE
========================================================= */

async function bildirimleriGetir(devam) {

    if (yukleniyor) {
        return;
    }

    yukleniyor = true;

    if (!devam) {
        sayfaNo = 0;
        bildirimListesi.innerHTML = "";
        bildirimListesi.appendChild(
            eleman("div", "yukleniyor", "Bildirimler yükleniyor...")
        );
    }

    const { data, error } = await supabaseClient.rpc(
        "bildirimleri_getir",
        {
            p_limit: SAYFA_BOYUTU,
            p_sayfa: sayfaNo
        }
    );

    yukleniyor = false;

    if (!devam) {
        bildirimListesi.innerHTML = "";
    }

    if (error) {

        console.error(error);

        bildirimListesi.appendChild(
            eleman(
                "div",
                "bos-liste",
                "Bildirimler yüklenemedi: " + hataMetni(error)
            )
        );

        dahaButonu.style.display = "none";

        return;
    }

    const liste = Array.isArray(data) ? data : [];

    if (!devam && liste.length === 0) {

        bildirimListesi.appendChild(
            eleman("div", "bos-liste", "Hiç bildirimin yok.")
        );

        dahaButonu.style.display = "none";

        await sayacGuncelle();

        return;
    }

    liste.forEach(b => bildirimListesi.appendChild(bildirimKarti(b)));

    dahaButonu.style.display =
        liste.length === SAYFA_BOYUTU ? "inline-block" : "none";

    await sayacGuncelle();
}


dahaButonu.addEventListener("click", async () => {

    sayfaNo += 1;

    dahaButonu.disabled = true;

    await bildirimleriGetir(true);

    dahaButonu.disabled = false;
});


hepsiniOkuButonu.addEventListener("click", async () => {

    const { error } = await supabaseClient.rpc(
        "tum_bildirimleri_okundu_isaretle"
    );

    if (error) {
        alert(hataMetni(error));
        return;
    }

    bildirimListesi.querySelectorAll(".bildirim").forEach(k => {
        k.classList.remove("okunmamis");
        const d = k.querySelector(".okundu-buton");
        if (d) { d.remove(); }
    });

    await sayacGuncelle();
});


/* =========================================================
   OTURUM
========================================================= */

async function sayfayiHazirla() {

    if (!mevcutKullanici) {

        girisUyarisi.style.display = "block";
        bildirimBolumu.style.display = "none";

        return;
    }

    girisUyarisi.style.display = "none";
    bildirimBolumu.style.display = "block";

    await bildirimleriGetir(false);
}


supabaseClient.auth.onAuthStateChange(async (event, session) => {

    ustCubuguGuncelle(session);

    const eskiId = mevcutKullanici ? mevcutKullanici.id : null;
    const yeniId = session && session.user ? session.user.id : null;

    mevcutKullanici = session && session.user ? session.user : null;

    if (eskiId !== yeniId) {
        await sayfayiHazirla();
    }
});


(async function baslat() {

    const { data } = await supabaseClient.auth.getSession();

    ustCubuguGuncelle(data.session);

    mevcutKullanici = data.session ? data.session.user : null;

    await sayfayiHazirla();
})();
</script>
