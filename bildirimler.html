<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fff19a">
<link rel="apple-touch-icon" href="ikonlar/apple-touch-icon.png">

    <title>Bildirimler - Okul Ustası</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="bildirimler.css">

<!-- Ortak tema + panel (ortak.css / ortak.js) -->
<script>
/* Tema tercihi sayfa çizilmeden ÖNCE uygulanır (beyaz parlama olmaz). */
try {
    if (localStorage.getItem("ou-tema") === "dark") {
        document.documentElement.setAttribute("data-tema", "dark");
    }
} catch (e) {}
</script>
<link rel="stylesheet" href="ortak.css">
</head>

<body class="ou-hatli">

<!-- =====================================================
     ÜST MENÜ (tüm sayfalarda aynı)
===================================================== -->
<header class="ou-ust">

    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <a class="ou-giris" id="topLoginLink" href="giris.html">Giriş Yap</a>

        <div id="topUser">
            <span id="topUserEmail"></span>
            <button type="button" class="ou-cikis" id="logoutButton">Çıkış</button>
        </div>

        <button type="button" class="ou-tema" id="ouTemaDugme"
                aria-label="Karanlık temaya geç">🌙</button>
    </div>

</header>

<main class="sayfa">

    <section class="baslik-alani">

        <h1>Bildirimler</h1>

        <p>
            Sana özel haberler burada görünür. Sadece sen görebilirsin.
        </p>

    </section>


    <div
        id="girisUyarisi"
        class="giris-uyarisi"
        style="display:none;">

        Bildirimlerini görmek için
        <a href="giris.html">giriş yapman gerekiyor.</a>

    </div>


    <section id="bildirimBolumu" style="display:none;">

        <div class="liste-baslik">

            <h2>
                Bildirimlerin
                <span id="okunmamisSayi" class="sayi-rozet"></span>
            </h2>

            <button
                id="hepsiniOkuButonu"
                class="kucuk-buton"
                type="button">
                Tümünü okundu işaretle
            </button>

        </div>

        <div id="bildirimListesi">
            <div class="yukleniyor">Bildirimler yükleniyor...</div>
        </div>

        <div class="sayfalama">
            <button
                id="dahaButonu"
                class="daha-buton"
                type="button"
                style="display:none;">
                Daha Fazla
            </button>
        </div>

    </section>

</main>

<script src="bildirimler.js"></script>


<script src="ortak.js"></script>

</body>
</html>
