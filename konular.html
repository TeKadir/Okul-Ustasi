<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Konular - Okul Ustası</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --vurgu: #fff19a;
            --vurgu-koyu: #e5cf4c;
            --mavi: #3b82f6;
            --kirmizi: #ef4444;
            --yesil: #22c55e;
            --metin: #222;
            --sol-cizgi: #e79b9b;
            --kagit: #fffdf5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    to right,
                    transparent 0,
                    transparent 65px,
                    rgba(231, 155, 155, 0.7) 66px,
                    transparent 67px
                ),
                repeating-linear-gradient(
                    to bottom,
                    var(--kagit) 0px,
                    var(--kagit) 31px,
                    #c9d8e6 32px
                );

            font-family: "Comic Sans MS", "Segoe Print", cursive;
            color: var(--metin);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           ÜST BAR
        ===================================================== */

        .ust-bar {
            width: 100%;
            padding: 18px 30px 18px 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #222;

            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            text-decoration: none;
            color: #222;
            font-size: 25px;
            font-weight: bold;
        }

        .ust-sag {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kullanici-yazisi {
            font-size: 14px;
        }

        .ust-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 13px;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .ust-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #222;
        }

        .cikis-buton {
            border: 2px solid #222;
            background: #ffd7d7;
            padding: 7px 13px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           ANA ALAN
        ===================================================== */

        .sayfa {
            width: min(1100px, calc(100% - 40px));
            margin: 35px auto 70px;
        }

        .baslik-alani {
            margin-bottom: 25px;
        }

        .baslik-alani h1 {
            margin: 0;
            display: inline-block;

            background: var(--vurgu);
            padding: 8px 18px;

            font-size: clamp(28px, 5vw, 44px);
            transform: rotate(-1deg);

            border: 2px solid #222;
            box-shadow: 5px 5px 0 #222;
        }

        .baslik-alani p {
            margin: 18px 0 0;
            font-size: 17px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 22px;

            box-shadow: 6px 6px 0 #222;
            margin-bottom: 30px;
        }

        .form-karti h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .giris-uyarisi {
            background: #fff3cd;
            border: 2px dashed #9a7b00;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 8px;
        }

        .giris-uyarisi a {
            color: #1d4ed8;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 15px;
        }

        .alan {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alan label {
            font-weight: bold;
        }

        .alan input,
        .alan textarea,
        .alan select {
            width: 100%;
            border: 2px solid #222;
            border-radius: 7px;
            background: #fffef8;
            padding: 10px 12px;
            outline: none;
        }

        .alan input:focus,
        .alan textarea:focus,
        .alan select:focus {
            box-shadow: 3px 3px 0 var(--vurgu-koyu);
        }

        .tam-alan {
            grid-column: 1 / -1;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-alt {
            margin-top: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .karakter {
            font-size: 13px;
            color: #555;
        }

        .gonder-buton {
            border: 2px solid #222;
            background: var(--vurgu);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .gonder-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #222;
        }

        .gonder-buton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .mesaj {
            margin-top: 15px;
            padding: 10px 13px;
            border-radius: 7px;
            display: none;
        }

        .mesaj.basari {
            display: block;
            background: #dcfce7;
            border: 2px solid #166534;
        }

        .mesaj.hata {
            display: block;
            background: #fee2e2;
            border: 2px solid #991b1b;
        }

        /* =====================================================
           ARAMA / FİLTRE
        ===================================================== */

        .filtre-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 18px;
            margin-bottom: 25px;

            display: grid;
            grid-template-columns: 220px 1fr auto;
            gap: 12px;

            box-shadow: 4px 4px 0 #222;
        }

        .filtre-karti select,
        .filtre-karti input {
            width: 100%;
            border: 2px solid #222;
            padding: 9px 11px;
            border-radius: 7px;
            background: white;
        }

        .ara-buton {
            border: 2px solid #222;
            background: #dbeafe;
            padding: 9px 18px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           GÖNDERİLER
        ===================================================== */

        .liste-baslik {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            margin-bottom: 15px;
        }

        .liste-baslik h2 {
            margin: 0;
            font-size: 27px;
        }

        .yukleniyor {
            padding: 30px;
            text-align: center;
            font-size: 18px;
        }

        .bos-liste {
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #555;
            padding: 30px;
            text-align: center;
            font-size: 17px;
        }

        .gonderi {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #222;

            border-left: 8px solid #f1d84b;

            padding: 20px;
            margin-bottom: 20px;

            box-shadow: 4px 4px 0 #222;
        }

        .gonderi-ust {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .gonderi-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .ders-etiket {
            background: var(--vurgu);
            border: 1px solid #222;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .gonderi-tarih {
            color: #666;
            font-size: 13px;
        }

        .gonderi h3 {
            margin: 12px 0 8px;
            font-size: 24px;
            line-height: 1.2;
        }

        .gonderi-aciklama {
            white-space: pre-wrap;
            line-height: 1.6;
            font-family: inherit;
            font-size: 16px;
        }

        .gonderi-alt {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px dashed #999;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .gonderi-sahip {
            font-size: 14px;
            color: #555;
        }

        .gonderi-islemler {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .kucuk-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 11px;
            border-radius: 7px;
            font-size: 14px;
            box-shadow: 2px 2px 0 #222;
        }

        .cevaplari-buton {
            background: #e0f2fe;
        }

        .sil-buton {
            background: #fee2e2;
        }

        /* =====================================================
           CEVAPLAR
        ===================================================== */

        .cevap-alani {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid #222;
        }

        .cevap-alani.acik {
            display: block;
        }

        .cevap-listesi {
            margin-bottom: 18px;
        }

        .cevap {
            background: #fffef8;
            border: 1px solid #aaa;
            border-radius: 7px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .cevap-ust {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .cevap-yazar {
            font-weight: bold;
        }

        .cevap-tarih {
            color: #777;
            font-size: 12px;
        }

        .cevap-metin {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .cevap-sil {
            margin-top: 8px;
            border: 1px solid #991b1b;
            background: #fee2e2;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 12px;
        }

        .cevap-form {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .cevap-form textarea {
            flex: 1;
            min-height: 80px;
        }

        .cevap-gonder {
            border: 2px solid #222;
            background: #dcfce7;
            padding: 9px 15px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .cevap-giris {
            background: #fff3cd;
            border: 1px dashed #9a7b00;
            padding: 10px;
        }

        /* =====================================================
           SAYFALAMA
        ===================================================== */

        .sayfalama {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .daha-buton {
            border: 2px solid #222;
            background: white;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .daha-buton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 750px) {
            .ust-bar {
                padding: 14px 15px;
                flex-direction: column;
                align-items: stretch;
            }

            .ust-sag {
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .sayfa {
                width: calc(100% - 24px);
                margin-top: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .tam-alan {
                grid-column: auto;
            }

            .filtre-karti {
                grid-template-columns: 1fr;
            }

            .gonderi-ust,
            .gonderi-alt {
                flex-direction: column;
                align-items: stretch;
            }

            .gonderi-islemler {
                width: 100%;
            }

            .kucuk-buton {
                flex: 1;
            }

            .cevap-form {
                flex-direction: column;
                align-items: stretch;
            }

            .cevap-gonder {
                width: 100%;
            }
        }
    
        /* ---- Konular sayfasına özel ---- */

        .ders-izgara {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }

        .ders-dugme {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 78px;
            padding: 12px 8px;
            border: 2px solid #222;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.93);
            box-shadow: 3px 3px 0 #222;
            font-weight: bold;
            text-align: center;
            color: inherit;
        }

        .ders-dugme:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #222;
        }

        .ders-dugme.secili {
            background: var(--vurgu);
        }

        .ders-ikon {
            font-size: 24px;
        }

        .ders-sayi {
            font-size: 12px;
            font-weight: normal;
            color: #555;
        }

        .oynatici {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #222;
            padding: 18px;
            margin-bottom: 28px;
            box-shadow: 5px 5px 0 #222;
        }

        .video-cerceve {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 2px solid #222;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-cerceve iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .oynatici h3 {
            margin: 14px 0 4px;
            font-size: 24px;
        }

        .video-konu {
            font-weight: bold;
        }

        .video-aciklama {
            white-space: pre-wrap;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .video-karti {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #222;
            border-left: 8px solid #f1d84b;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: 3px 3px 0 #222;
        }

        .video-karti.oynuyor {
            background: #fffbe0;
        }

        .video-oynat {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            border: 2px solid #222;
            border-radius: 50%;
            background: var(--vurgu);
            font-size: 20px;
            box-shadow: 2px 2px 0 #222;
        }

        .video-bilgi {
            flex: 1;
            min-width: 0;
        }

        .video-bilgi strong {
            display: block;
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        .video-alt {
            font-size: 13px;
            color: #666;
        }

        .video-islemler {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-kutu {
            border-style: dashed;
        }

        html[data-tema="dark"] .ders-dugme,
        html[data-tema="dark"] .oynatici,
        html[data-tema="dark"] .video-karti {
            background: rgba(39, 38, 49, 0.94);
            color: #ebe8df;
            border-color: #6f6c7a;
            box-shadow: 3px 3px 0 #0c0b10;
        }

        html[data-tema="dark"] .ders-dugme.secili {
            background: #5c5113;
            border-color: #d8c85a;
        }

        html[data-tema="dark"] .video-karti {
            border-left-color: #c9b440;
        }

        html[data-tema="dark"] .video-karti.oynuyor {
            background: #34301a;
        }

        html[data-tema="dark"] .video-oynat {
            background: #5c5113;
            color: #fff6c2;
            border-color: #d8c85a;
        }

        html[data-tema="dark"] .ders-sayi,
        html[data-tema="dark"] .video-alt {
            color: #a9a5b3;
        }

        html[data-tema="dark"] .video-cerceve {
            border-color: #8d8a96;
        }

        @media (max-width: 750px) {

            .video-karti {
                flex-wrap: wrap;
            }

            .video-islemler {
                width: 100%;
            }

            .video-islemler .kucuk-buton {
                flex: 1;
            }

            .oynatici {
                padding: 12px;
            }

            .oynatici h3 {
                font-size: 20px;
            }
        }

    </style>

<!-- Ortak tema + panel (ortak.css / ortak.js) -->
<script>
/* Tema tercihi sayfa çizilmeden ÖNCE uygulanır (beyaz parlama olmaz). */
try {
    if (localStorage.getItem("ou-tema") === "dark") {
        document.documentElement.setAttribute("data-tema", "dark");
    }
} catch (e) {}
</script>

</head>

<body class="ou-hatli">

<!-- =====================================================
     ÜST MENÜ (tüm sayfalarda aynı)
===================================================== -->
<header class="ou-ust">

    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <a class="ou-giris" id="topLoginLink" href="giris.html">Giriş Yap</a>

        <div id="topUser">
            <span id="topUserEmail"></span>
            <button type="button" class="ou-cikis" id="logoutButton">Çıkış</button>
        </div>

        <button type="button" class="ou-tema" id="ouTemaDugme"
                aria-label="Karanlık temaya geç">🌙</button>
    </div>

</header>

<main class="sayfa">

    <section class="baslik-alani">

        <h1>Konular</h1>

        <p>
            Önce dersini seç, sonra konu anlatım videolarını izle.
        </p>

    </section>


    <!-- ADMİN: video ekleme / düzenleme (yetki Supabase tarafında da kontrol edilir) -->
    <section
        id="adminKutu"
        class="form-karti admin-kutu"
        style="display:none;">

        <h2 id="adminBaslik">Yeni konu videosu ekle</h2>

        <form id="videoFormu">

            <div class="form-grid">

                <div class="alan">
                    <label for="vDers">Ders</label>
                    <select id="vDers" required>
                        <option value="">Ders seç</option>
                    </select>
                </div>

                <div class="alan">
                    <label for="vBaslik">Video başlığı</label>
                    <input
                        id="vBaslik"
                        type="text"
                        maxlength="150"
                        placeholder="Örn: Üslü sayılar - 1"
                        required>
                </div>

                <div class="alan">
                    <label for="vKonu">Konu adı (isteğe bağlı)</label>
                    <input
                        id="vKonu"
                        type="text"
                        maxlength="150"
                        placeholder="Örn: Üslü İfadeler">
                </div>

                <div class="alan">
                    <label for="vUrl">YouTube bağlantısı</label>
                    <input
                        id="vUrl"
                        type="url"
                        inputmode="url"
                        placeholder="https://www.youtube.com/watch?v=..."
                        required>
                </div>

                <div class="alan tam-alan">
                    <label for="vAciklama">Açıklama (isteğe bağlı)</label>
                    <textarea
                        id="vAciklama"
                        maxlength="1000"
                        placeholder="Videoda neler anlatılıyor?"></textarea>
                </div>

            </div>

            <div class="form-alt">

                <button
                    id="vIptal"
                    class="kucuk-buton"
                    type="button"
                    style="display:none;">
                    Vazgeç
                </button>

                <button
                    id="vKaydet"
                    class="gonder-buton"
                    type="submit">
                    Videoyu Ekle
                </button>

            </div>

            <div id="vMesaj" class="mesaj"></div>

        </form>

    </section>


    <!-- 1) DERS SEÇ -->
    <section>

        <div class="liste-baslik">
            <h2>1. Dersini seç</h2>
        </div>

        <div id="dersIzgara" class="ders-izgara">
            <div class="yukleniyor">Dersler yükleniyor...</div>
        </div>

    </section>


    <!-- 2) OYNATICI -->
    <section
        id="oynaticiAlani"
        class="oynatici"
        style="display:none;">

        <div id="videoCerceve" class="video-cerceve"></div>

        <h3 id="oynatBaslik"></h3>
        <div id="oynatKonu" class="video-konu"></div>
        <p id="oynatAciklama" class="video-aciklama"></p>

    </section>


    <!-- 3) VİDEO LİSTESİ -->
    <section id="videoBolumu" style="display:none;">

        <div class="liste-baslik">
            <h2 id="videoBolumBaslik">2. Videoyu seç</h2>
        </div>

        <div id="videoListesi"></div>

    </section>

</main>

<script>
/* =========================================================
   OKUL USTASI - KONULAR
   Kullanılan RPC'ler:
   - konu_dersleri()               (herkes)
   - konu_videolarini_getir()      (herkes)
   - konu_videosu_ekle()           (SADECE admin - sunucuda kontrol)
   - konu_videosu_guncelle()       (SADECE admin - sunucuda kontrol)
   - konu_videosu_sil()            (SADECE admin - sunucuda kontrol)
   - is_admin()                    (sadece düğmeleri göstermek için)

   Videolar YouTube bağlantısı olarak eklenir; sunucu bağlantıdan
   11 haneli video kodunu ayıklar, başka site bağlantısı kabul etmez.
========================================================= */

const SUPABASE_URL =
    "https://hinisayolrgyzcoztobi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_76n3XsryMfvfdYwKeUu6SA_TCxImZiW";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* Sunucudan alınamazsa kullanılacak yedek liste */
const YEDEK_DERSLER = [
    "Matematik", "Fen Bilimleri", "Türkçe", "İngilizce",
    "İnkılap Tarihi", "Din Kültürü", "Diğer"
];

const DERS_IKONLARI = {
    "Matematik": "➗",
    "Fen Bilimleri": "🔬",
    "Türkçe": "📖",
    "İngilizce": "🔤",
    "İnkılap Tarihi": "🏛️",
    "Din Kültürü": "🕌",
    "Diğer": "📌"
};

let mevcutKullanici = null;
let adminMi = false;

let dersler = [];
let tumVideolar = [];
let seciliDers = null;
let oynayanId = null;
let duzenlenenId = null;

const dersIzgara = document.getElementById("dersIzgara");
const videoBolumu = document.getElementById("videoBolumu");
const videoBolumBaslik = document.getElementById("videoBolumBaslik");
const videoListesi = document.getElementById("videoListesi");
const oynaticiAlani = document.getElementById("oynaticiAlani");
const videoCerceve = document.getElementById("videoCerceve");
const oynatBaslik = document.getElementById("oynatBaslik");
const oynatKonu = document.getElementById("oynatKonu");
const oynatAciklama = document.getElementById("oynatAciklama");

const adminKutu = document.getElementById("adminKutu");
const adminBaslik = document.getElementById("adminBaslik");
const videoFormu = document.getElementById("videoFormu");
const vDers = document.getElementById("vDers");
const vBaslik = document.getElementById("vBaslik");
const vKonu = document.getElementById("vKonu");
const vUrl = document.getElementById("vUrl");
const vAciklama = document.getElementById("vAciklama");
const vKaydet = document.getElementById("vKaydet");
const vIptal = document.getElementById("vIptal");
const vMesaj = document.getElementById("vMesaj");


/* =========================================================
   ÜST MENÜ (diğer sayfalarla aynı mantık)
========================================================= */

const topLoginLink = document.getElementById("topLoginLink");
const topUser = document.getElementById("topUser");
const topUserEmail = document.getElementById("topUserEmail");
const logoutButton = document.getElementById("logoutButton");

function ustCubuguGuncelle(session) {

    if (session && session.user) {

        topLoginLink.style.display = "none";
        topUser.style.display = "flex";
        topUserEmail.textContent = session.user.email || "";

    } else {

        topLoginLink.style.display = "inline-block";
        topUser.style.display = "none";
        topUserEmail.textContent = "";
    }
}

logoutButton.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();
});


/* =========================================================
   YARDIMCI
========================================================= */

function eleman(tag, className, text) {

    const el = document.createElement(tag);

    if (className) {
        el.className = className;
    }

    if (text !== undefined) {
        el.textContent = text;
    }

    return el;
}

function hataMetni(error) {

    if (!error) {
        return "Bilinmeyen bir hata oluştu.";
    }

    return error.message || "Bilinmeyen bir hata oluştu.";
}

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    return new Date(tarih).toLocaleString("tr-TR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


function formMesaji(metin, basari) {

    vMesaj.textContent = metin || "";
    vMesaj.className = metin ? "mesaj " + (basari ? "basari" : "hata") : "mesaj";
}


/* =========================================================
   DERSLER
========================================================= */

async function dersleriGetir() {

    const { data, error } = await supabaseClient.rpc("konu_dersleri");

    dersler =
        !error && Array.isArray(data) && data.length > 0
            ? data
            : YEDEK_DERSLER;

    vDers.innerHTML = "";

    const ilk = document.createElement("option");
    ilk.value = "";
    ilk.textContent = "Ders seç";
    vDers.appendChild(ilk);

    dersler.forEach(d => {

        const o = document.createElement("option");
        o.value = d;
        o.textContent = d;
        vDers.appendChild(o);
    });
}


function dersDugmeleriniCiz() {

    dersIzgara.innerHTML = "";

    dersler.forEach(d => {

        const sayi = tumVideolar.filter(v => v.ders === d).length;

        const dugme = eleman("button", "ders-dugme" + (d === seciliDers ? " secili" : ""));
        dugme.type = "button";

        dugme.appendChild(eleman("span", "ders-ikon", DERS_IKONLARI[d] || "📚"));
        dugme.appendChild(eleman("span", null, d));
        dugme.appendChild(eleman("span", "ders-sayi", sayi + " video"));

        dugme.addEventListener("click", () => dersSec(d));

        dersIzgara.appendChild(dugme);
    });
}


function dersSec(d) {

    seciliDers = d;
    oynayanId = null;

    history.replaceState(null, "", "#" + encodeURIComponent(d));

    oynatıcıyiKapat();
    dersDugmeleriniCiz();
    videoListesiniCiz();

    videoBolumu.scrollIntoView({ behavior: "smooth", block: "start" });
}


/* =========================================================
   VİDEOLAR
========================================================= */

async function videolariGetir() {

    const { data, error } = await supabaseClient.rpc(
        "konu_videolarini_getir",
        { p_ders: null }
    );

    if (error) {

        console.error(error);

        dersIzgara.innerHTML = "";
        dersIzgara.appendChild(
            eleman("div", "bos-liste", "Videolar yüklenemedi: " + hataMetni(error))
        );

        return false;
    }

    tumVideolar = Array.isArray(data) ? data : [];

    return true;
}


function videoListesiniCiz() {

    videoListesi.innerHTML = "";

    if (!seciliDers) {
        videoBolumu.style.display = "none";
        return;
    }

    videoBolumu.style.display = "block";
    videoBolumBaslik.textContent = "2. " + seciliDers + " videoları";

    const liste = tumVideolar.filter(v => v.ders === seciliDers);

    if (liste.length === 0) {

        videoListesi.appendChild(
            eleman("div", "bos-liste", "Bu ders için henüz video eklenmemiş.")
        );

        return;
    }

    liste.forEach(v => {

        const kart = eleman(
            "article",
            "video-karti" + (v.id === oynayanId ? " oynuyor" : "")
        );

        const oynat = eleman("button", "video-oynat", "▶");
        oynat.type = "button";
        oynat.setAttribute("aria-label", v.baslik + " videosunu izle");
        oynat.addEventListener("click", () => videoOynat(v));

        const bilgi = eleman("div", "video-bilgi");
        bilgi.appendChild(eleman("strong", null, v.baslik));

        const alt = [];

        if (v.konu_adi) {
            alt.push(v.konu_adi);
        }

        alt.push(tarihFormatla(v.created_at));

        bilgi.appendChild(eleman("div", "video-alt", alt.join("  •  ")));

        kart.appendChild(oynat);
        kart.appendChild(bilgi);

        const islemler = eleman("div", "video-islemler");

        const izle = eleman("button", "kucuk-buton cevaplari-buton", "İzle");
        izle.type = "button";
        izle.addEventListener("click", () => videoOynat(v));
        islemler.appendChild(izle);

        /* Düğmeler yalnızca gösterim içindir; asıl yetki sunucuda. */
        if (adminMi) {

            const duzenle = eleman("button", "kucuk-buton", "Düzenle");
            duzenle.type = "button";
            duzenle.addEventListener("click", () => duzenlemeyeBasla(v));
            islemler.appendChild(duzenle);

            const sil = eleman("button", "kucuk-buton sil-buton", "Sil");
            sil.type = "button";
            sil.addEventListener("click", () => videoSil(v));
            islemler.appendChild(sil);
        }

        kart.appendChild(islemler);
        videoListesi.appendChild(kart);
    });
}


/* =========================================================
   OYNATICI  (youtube-nocookie: izleme başlayana kadar çerez yok)
========================================================= */

function oynatıcıyiKapat() {

    videoCerceve.innerHTML = "";
    oynaticiAlani.style.display = "none";
}


function videoOynat(v) {

    /* Kod sunucuda doğrulanıyor; burada da bir kez daha kontrol. */
    if (!/^[A-Za-z0-9_-]{11}$/.test(v.video_kodu)) {
        alert("Bu videonun bağlantısı geçersiz.");
        return;
    }

    oynayanId = v.id;

    videoCerceve.innerHTML = "";

    const iframe = document.createElement("iframe");

    iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(v.video_kodu) +
        "?rel=0&playsinline=1";

    iframe.title = v.baslik;

    iframe.allow =
        "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";

    iframe.setAttribute("allowfullscreen", "");
    iframe.referrerPolicy = "strict-origin-when-cross-origin";

    videoCerceve.appendChild(iframe);

    oynatBaslik.textContent = v.baslik;
    oynatKonu.textContent = v.konu_adi || "";
    oynatKonu.style.display = v.konu_adi ? "block" : "none";
    oynatAciklama.textContent = v.aciklama || "";
    oynatAciklama.style.display = v.aciklama ? "block" : "none";

    oynaticiAlani.style.display = "block";

    videoListesiniCiz();

    oynaticiAlani.scrollIntoView({ behavior: "smooth", block: "start" });
}


/* =========================================================
   ADMİN: EKLE / GÜNCELLE / SİL
========================================================= */

function adminAlaniniGuncelle() {

    adminKutu.style.display = adminMi ? "block" : "none";
}


function formuSifirla() {

    duzenlenenId = null;

    videoFormu.reset();

    if (seciliDers) {
        vDers.value = seciliDers;
    }

    adminBaslik.textContent = "Yeni konu videosu ekle";
    vKaydet.textContent = "Videoyu Ekle";
    vIptal.style.display = "none";
}


function duzenlemeyeBasla(v) {

    duzenlenenId = v.id;

    vDers.value = v.ders;
    vBaslik.value = v.baslik;
    vKonu.value = v.konu_adi || "";
    vAciklama.value = v.aciklama || "";
    vUrl.value = "https://www.youtube.com/watch?v=" + v.video_kodu;

    adminBaslik.textContent = "Videoyu düzenle";
    vKaydet.textContent = "Değişiklikleri Kaydet";
    vIptal.style.display = "inline-block";

    formMesaji("");

    adminKutu.scrollIntoView({ behavior: "smooth", block: "start" });
}


vIptal.addEventListener("click", () => {

    formuSifirla();
    formMesaji("");
});


videoFormu.addEventListener("submit", async event => {

    event.preventDefault();

    formMesaji("");

    const ders = vDers.value;
    const baslik = vBaslik.value.trim();
    const konu = vKonu.value.trim();
    const aciklama = vAciklama.value.trim();
    const url = vUrl.value.trim();

    if (!ders) { formMesaji("Lütfen bir ders seç."); return; }
    if (!baslik) { formMesaji("Video başlığı boş bırakılamaz."); return; }
    if (!url) { formMesaji("YouTube bağlantısı gerekli."); return; }

    vKaydet.disabled = true;

    const duzenleme = duzenlenenId !== null;

    const { error } = duzenleme
        ? await supabaseClient.rpc("konu_videosu_guncelle", {
            p_id: duzenlenenId,
            p_ders: ders,
            p_baslik: baslik,
            p_konu_adi: konu,
            p_aciklama: aciklama,
            p_video_url: url
        })
        : await supabaseClient.rpc("konu_videosu_ekle", {
            p_ders: ders,
            p_baslik: baslik,
            p_konu_adi: konu,
            p_aciklama: aciklama,
            p_video_url: url
        });

    vKaydet.disabled = false;

    if (error) {
        console.error(error);
        formMesaji(hataMetni(error));
        return;
    }

    formuSifirla();

    formMesaji(duzenleme ? "Video güncellendi." : "Video eklendi.", true);

    await videolariGetir();

    if (!seciliDers) {
        seciliDers = ders;
    }

    dersDugmeleriniCiz();
    videoListesiniCiz();
});


async function videoSil(v) {

    if (!confirm("\"" + v.baslik + "\" videosunu silmek istediğine emin misin?")) {
        return;
    }

    const { error } = await supabaseClient.rpc(
        "konu_videosu_sil",
        { p_id: v.id }
    );

    if (error) {
        alert(hataMetni(error));
        return;
    }

    if (oynayanId === v.id) {
        oynayanId = null;
        oynatıcıyiKapat();
    }

    await videolariGetir();

    dersDugmeleriniCiz();
    videoListesiniCiz();
}


/* =========================================================
   OTURUM + BAŞLAT
========================================================= */

async function adminKontrol() {

    adminMi = false;

    if (mevcutKullanici) {

        const { data, error } = await supabaseClient.rpc("is_admin");

        adminMi = !error && data === true;
    }

    adminAlaniniGuncelle();
}


supabaseClient.auth.onAuthStateChange(async (event, session) => {

    ustCubuguGuncelle(session);

    const eskiId = mevcutKullanici ? mevcutKullanici.id : null;
    const yeniId = session && session.user ? session.user.id : null;

    mevcutKullanici = session && session.user ? session.user : null;

    if (eskiId !== yeniId) {

        await adminKontrol();
        videoListesiniCiz();
    }
});


(async function baslat() {

    const { data } = await supabaseClient.auth.getSession();

    ustCubuguGuncelle(data.session);

    mevcutKullanici = data.session ? data.session.user : null;

    await dersleriGetir();

    const tamam = await videolariGetir();

    if (!tamam) {
        return;
    }

    /* Adres çubuğunda #Matematik gibi bir ders varsa onu aç. */
    const hash = decodeURIComponent(location.hash.replace("#", ""));

    if (dersler.includes(hash)) {
        seciliDers = hash;
    }

    dersDugmeleriniCiz();
    videoListesiniCiz();

    await adminKontrol();

    videoListesiniCiz();
})();
</script>
