<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ders Yardımı - Okul Ustası</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --vurgu: #fff19a;
            --vurgu-koyu: #e5cf4c;
            --mavi: #3b82f6;
            --kirmizi: #ef4444;
            --yesil: #22c55e;
            --metin: #222;
            --sol-cizgi: #e79b9b;
            --kagit: #fffdf5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    to right,
                    transparent 0,
                    transparent 65px,
                    rgba(231, 155, 155, 0.7) 66px,
                    transparent 67px
                ),
                repeating-linear-gradient(
                    to bottom,
                    var(--kagit) 0px,
                    var(--kagit) 31px,
                    #c9d8e6 32px
                );

            font-family: "Comic Sans MS", "Segoe Print", cursive;
            color: var(--metin);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           ÜST BAR
        ===================================================== */

        .ust-bar {
            width: 100%;
            padding: 18px 30px 18px 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #222;

            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            text-decoration: none;
            color: #222;
            font-size: 25px;
            font-weight: bold;
        }

        .ust-sag {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kullanici-yazisi {
            font-size: 14px;
        }

        .ust-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 13px;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .ust-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #222;
        }

        .cikis-buton {
            border: 2px solid #222;
            background: #ffd7d7;
            padding: 7px 13px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           ANA ALAN
        ===================================================== */

        .sayfa {
            width: min(1100px, calc(100% - 40px));
            margin: 35px auto 70px;
        }

        .baslik-alani {
            margin-bottom: 25px;
        }

        .baslik-alani h1 {
            margin: 0;
            display: inline-block;

            background: var(--vurgu);
            padding: 8px 18px;

            font-size: clamp(28px, 5vw, 44px);
            transform: rotate(-1deg);

            border: 2px solid #222;
            box-shadow: 5px 5px 0 #222;
        }

        .baslik-alani p {
            margin: 18px 0 0;
            font-size: 17px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 22px;

            box-shadow: 6px 6px 0 #222;
            margin-bottom: 30px;
        }

        .form-karti h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .giris-uyarisi {
            background: #fff3cd;
            border: 2px dashed #9a7b00;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 8px;
        }

        .giris-uyarisi a {
            color: #1d4ed8;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 15px;
        }

        .alan {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alan label {
            font-weight: bold;
        }

        .alan input,
        .alan textarea,
        .alan select {
            width: 100%;
            border: 2px solid #222;
            border-radius: 7px;
            background: #fffef8;
            padding: 10px 12px;
            outline: none;
        }

        .alan input:focus,
        .alan textarea:focus,
        .alan select:focus {
            box-shadow: 3px 3px 0 var(--vurgu-koyu);
        }

        .tam-alan {
            grid-column: 1 / -1;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-alt {
            margin-top: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .karakter {
            font-size: 13px;
            color: #555;
        }

        .gonder-buton {
            border: 2px solid #222;
            background: var(--vurgu);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .gonder-buton:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #222;
        }

        .gonder-buton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .mesaj {
            margin-top: 15px;
            padding: 10px 13px;
            border-radius: 7px;
            display: none;
        }

        .mesaj.basari {
            display: block;
            background: #dcfce7;
            border: 2px solid #166534;
        }

        .mesaj.hata {
            display: block;
            background: #fee2e2;
            border: 2px solid #991b1b;
        }

        /* =====================================================
           ARAMA / FİLTRE
        ===================================================== */

        .filtre-karti {
            background: rgba(255, 255, 255, 0.93);
            border: 2px solid #222;
            padding: 18px;
            margin-bottom: 25px;

            display: grid;
            grid-template-columns: 220px 1fr auto;
            gap: 12px;

            box-shadow: 4px 4px 0 #222;
        }

        .filtre-karti select,
        .filtre-karti input {
            width: 100%;
            border: 2px solid #222;
            padding: 9px 11px;
            border-radius: 7px;
            background: white;
        }

        .ara-buton {
            border: 2px solid #222;
            background: #dbeafe;
            padding: 9px 18px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        /* =====================================================
           GÖNDERİLER
        ===================================================== */

        .liste-baslik {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            margin-bottom: 15px;
        }

        .liste-baslik h2 {
            margin: 0;
            font-size: 27px;
        }

        .yukleniyor {
            padding: 30px;
            text-align: center;
            font-size: 18px;
        }

        .bos-liste {
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #555;
            padding: 30px;
            text-align: center;
            font-size: 17px;
        }

        .gonderi {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #222;

            border-left: 8px solid #f1d84b;

            padding: 20px;
            margin-bottom: 20px;

            box-shadow: 4px 4px 0 #222;
        }

        .gonderi-ust {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .gonderi-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .ders-etiket {
            background: var(--vurgu);
            border: 1px solid #222;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .gonderi-tarih {
            color: #666;
            font-size: 13px;
        }

        .gonderi h3 {
            margin: 12px 0 8px;
            font-size: 24px;
            line-height: 1.2;
        }

        .gonderi-aciklama {
            white-space: pre-wrap;
            line-height: 1.6;
            font-family: inherit;
            font-size: 16px;
        }

        .gonderi-alt {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px dashed #999;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .gonderi-sahip {
            font-size: 14px;
            color: #555;
        }

        .gonderi-islemler {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .kucuk-buton {
            border: 2px solid #222;
            background: white;
            padding: 7px 11px;
            border-radius: 7px;
            font-size: 14px;
            box-shadow: 2px 2px 0 #222;
        }

        .cevaplari-buton {
            background: #e0f2fe;
        }

        .sil-buton {
            background: #fee2e2;
        }

        /* =====================================================
           CEVAPLAR
        ===================================================== */

        .cevap-alani {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid #222;
        }

        .cevap-alani.acik {
            display: block;
        }

        .cevap-listesi {
            margin-bottom: 18px;
        }

        .cevap {
            background: #fffef8;
            border: 1px solid #aaa;
            border-radius: 7px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .cevap-ust {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .cevap-yazar {
            font-weight: bold;
        }

        .cevap-tarih {
            color: #777;
            font-size: 12px;
        }

        .cevap-metin {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .cevap-sil {
            margin-top: 8px;
            border: 1px solid #991b1b;
            background: #fee2e2;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 12px;
        }

        .cevap-form {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .cevap-form textarea {
            flex: 1;
            min-height: 80px;
        }

        .cevap-gonder {
            border: 2px solid #222;
            background: #dcfce7;
            padding: 9px 15px;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 2px 2px 0 #222;
        }

        .cevap-giris {
            background: #fff3cd;
            border: 1px dashed #9a7b00;
            padding: 10px;
        }

        /* =====================================================
           SAYFALAMA
        ===================================================== */

        .sayfalama {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .daha-buton {
            border: 2px solid #222;
            background: white;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
        }

        .daha-buton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 750px) {
            .ust-bar {
                padding: 14px 15px;
                flex-direction: column;
                align-items: stretch;
            }

            .ust-sag {
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .sayfa {
                width: calc(100% - 24px);
                margin-top: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .tam-alan {
                grid-column: auto;
            }

            .filtre-karti {
                grid-template-columns: 1fr;
            }

            .gonderi-ust,
            .gonderi-alt {
                flex-direction: column;
                align-items: stretch;
            }

            .gonderi-islemler {
                width: 100%;
            }

            .kucuk-buton {
                flex: 1;
            }

            .cevap-form {
                flex-direction: column;
                align-items: stretch;
            }

            .cevap-gonder {
                width: 100%;
            }
        }
    </style>

<script>
/* =========================================================
   OKUL USTASI - DERS YARDIMI
   Mevcut SQL RPC sistemine göre yazılmıştır.

   KULLANILAN RPC'LER:
   - ders_listesi()
   - gonderileri_getir()
   - gonderi_ekle()
   - gonderi_sil()
   - gonderi_cevaplarini_getir()
   - gonderi_cevap_ekle()
   - gonderi_cevap_sil()
   - is_admin()
========================================================= */


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://hinisayolrgyzcoztobi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_76n3XsryMfvfdYwKeUu6SA_TCxImZiW";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   DURUM
========================================================= */

let mevcutKullanici = null;
let mevcutKullaniciAdminMi = false;

let dersler = [];

let sayfaNo = 0;

const SAYFA_BOYUTU = 20;

let yukleniyor = false;

let dahaFazlaVar = false;


/* =========================================================
   ELEMENTLER
========================================================= */

/* Üst menü artık tüm sayfalarda ortak; aynı işi yapan elemanlar kullanılıyor. */
const kullaniciKutusu =
    document.getElementById("topUser");

const kullaniciYazisi =
    document.getElementById("topUserEmail");

const girisButonu =
    document.getElementById("topLoginLink");

const cikisButonu =
    document.getElementById("logoutButton");

const girisUyarisi =
    document.getElementById("girisUyarisi");

const gonderiFormu =
    document.getElementById("gonderiFormu");

const ders =
    document.getElementById("ders");

const baslik =
    document.getElementById("baslik");

const aciklama =
    document.getElementById("aciklama");

const karakterSayisi =
    document.getElementById("karakterSayisi");

const gonderButonu =
    document.getElementById("gonderButonu");

const formMesaji =
    document.getElementById("formMesaji");

const filtreDers =
    document.getElementById("filtreDers");

const filtreArama =
    document.getElementById("filtreArama");

const araButonu =
    document.getElementById("araButonu");

const gonderiListesi =
    document.getElementById("gonderiListesi");

const dahaButonu =
    document.getElementById("dahaButonu");

const listeDurumu =
    document.getElementById("listeDurumu");


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    return new Date(tarih).toLocaleString(
        "tr-TR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function hataMetni(error) {

    if (!error) {
        return "Bilinmeyen bir hata oluştu.";
    }

    return error.message || "Bilinmeyen bir hata oluştu.";
}


/*
    DOM elemanı oluştururken innerHTML kullanmıyoruz.
    Kullanıcıların yazdığı metinler textContent ile ekleniyor.
*/
function eleman(tag, className, text) {

    const el = document.createElement(tag);

    if (className) {
        el.className = className;
    }

    if (text !== undefined) {
        el.textContent = text;
    }

    return el;
}


function mesajGoster(mesaj, basari = false) {

    formMesaji.textContent = mesaj;

    formMesaji.className =
        "mesaj " + (basari ? "basari" : "hata");
}


function mesajTemizle() {

    formMesaji.textContent = "";

    formMesaji.className = "mesaj";
}


/* =========================================================
   KULLANICI DURUMU
========================================================= */

async function kullaniciyiGuncelle() {

    const {
        data
    } = await supabaseClient.auth.getSession();

    mevcutKullanici =
        data.session?.user || null;


    if (!mevcutKullanici) {

        mevcutKullaniciAdminMi = false;

        kullaniciYazisi.textContent = "";

        kullaniciKutusu.style.display = "none";

        girisButonu.style.display =
            "inline-block";

        cikisButonu.style.display =
            "none";

        girisUyarisi.style.display =
            "block";

        gonderiFormu.style.opacity =
            "0.55";

        gonderButonu.disabled = true;

        return;
    }


    /*
       E-posta burada yalnızca kullanıcının
       kendi ekranında gösteriliyor.
    */

    kullaniciYazisi.textContent =
        mevcutKullanici.email || "Kullanıcı";

    girisButonu.style.display =
        "none";

    cikisButonu.style.display =
        "inline-block";

    kullaniciKutusu.style.display = "flex";

    girisUyarisi.style.display =
        "none";

    gonderiFormu.style.opacity =
        "1";

    gonderButonu.disabled = false;


    const {
        data: adminData,
        error: adminError
    } = await supabaseClient.rpc("is_admin");


    if (!adminError) {

        mevcutKullaniciAdminMi =
            adminData === true;

    } else {

        mevcutKullaniciAdminMi =
            false;
    }
}

   DERS LİSTESİ

    } = await supabaseClient.rpc(

    );

/* =========================================================
   KARAKTER SAYACI
========================================================= */

aciklama.addEventListener(
    "input",

        karakterSayisi.textContent =
            aciklama.value.length +

    }
);


/* =========================================================
   GÖNDERİ EKLE
========================================================= */

gonderiFormu.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        mesajTemizle();


        if (!mevcutKullanici) {

            mesajGoster(
                "Yardım istemek için önce giriş yapmalısın."
            );

            return;
        }


        const secilenDers =
            ders.value.trim();

        const baslikMetni =
            baslik.value.trim();

        const aciklamaMetni =
            aciklama.value.trim();


        if (!secilenDers) {

            mesajGoster(
                "Lütfen bir ders seç."
            );

            return;
        }


        if (!baslikMetni) {

            mesajGoster(
                "Başlık boş bırakılamaz."
            );

            return;
        }


        if (!aciklamaMetni) {

            mesajGoster(
                "Açıklama boş bırakılamaz."
            );

            return;
        }


        gonderButonu.disabled = true;

        gonderButonu.textContent =
            "Gönderiliyor...";


        const {
            error
        } = await supabaseClient.rpc(
            "gonderi_ekle",
            {
                p_tur: "ders_yardimi",

                p_ders: secilenDers,

                p_baslik: baslikMetni,

                p_aciklama: aciklamaMetni,

                p_teslim_tarihi: null
            }
        );


        if (error) {

            console.error(error);

            mesajGoster(
                hataMetni(error)
            );

            gonderButonu.disabled = false;

            gonderButonu.textContent =
                "Yardım İste";

            return;
        }


        /*
           Formu temizle.
        */

        ders.value = "";

        baslik.value = "";

        aciklama.value = "";

        karakterSayisi.textContent =
            "0 / 2000";


        mesajGoster(
            "Sorun başarıyla paylaşıldı.",
            true
        );


        /*
           Listeyi baştan yükle.
        */

        sayfaNo = 0;

        await gonderileriGetir(false);


        gonderButonu.disabled = false;

        gonderButonu.textContent =
            "Yardım İste";
    }
);


/* =========================================================
   GÖNDERİLERİ GETİR
========================================================= */

async function gonderileriGetir(devam = false) {

    if (yukleniyor) {
        return;
    }

    yukleniyor = true;


    if (!devam) {

        sayfaNo = 0;

        gonderiListesi.innerHTML = "";

        const yukleniyorYazisi =
            eleman(
                "div",
                "yukleniyor",
                "Sorular yükleniyor..."
            );

        gonderiListesi.appendChild(
            yukleniyorYazisi
        );
    }


    const secilenDers =
        filtreDers.value || null;

    const arama =
        filtreArama.value.trim() || null;


    const {
        data,
        error
    } = await supabaseClient.rpc(
        "gonderileri_getir",
        {
            p_tur: "ders_yardimi",

            p_ders: secilenDers,

            p_arama: arama,

            p_limit: SAYFA_BOYUTU,

            p_sayfa: sayfaNo
        }
    );


    yukleniyor = false;


    if (error) {

        console.error(error);

        if (!devam) {
            gonderiListesi.innerHTML = "";
        }

        const hata =
            eleman(
                "div",
                "bos-liste",
                "Sorular yüklenirken bir hata oluştu: " +
                hataMetni(error)
            );

        gonderiListesi.appendChild(
            hata
        );

        dahaButonu.style.display =
            "none";

        return;
    }


    const gonderiler =
        Array.isArray(data)
            ? data
            : [];


    /*
       İlk sayfadaysak listeyi temizliyoruz.
    */

    if (!devam) {
        gonderiListesi.innerHTML = "";
    }


    if (
        !devam &&
        gonderiler.length === 0
    ) {

        const bos =
            eleman(
                "div",
                "bos-liste",
                "Henüz bu bölümde bir soru yok."
            );

        gonderiListesi.appendChild(
            bos
        );

        dahaButonu.style.display =
            "none";

        listeDurumu.textContent =
            "";

        return;
    }


    gonderiler.forEach(
        gonderi => {

            const kart =
                gonderiOlustur(gonderi);

            gonderiListesi.appendChild(
                kart
            );
        }
    );


    /*
       Gelen kayıt sayısı 20 ise
       daha fazla kayıt olabileceğini varsayıyoruz.
    */

    dahaFazlaVar =
        gonderiler.length === SAYFA_BOYUTU;


    if (dahaFazlaVar) {

        dahaButonu.style.display =
            "inline-block";

    } else {

        dahaButonu.style.display =
            "none";
    }


    listeDurumu.textContent =
        gonderiler.length +
        " soru gösteriliyor";
}


/* =========================================================
   GÖNDERİ KARTI
========================================================= */

function gonderiOlustur(gonderi) {

    const kart =
        eleman(
            "article",
            "gonderi"
        );


    /* -----------------------------------------------------
       ÜST
    ----------------------------------------------------- */

    const ust =
        eleman(
            "div",
            "gonderi-ust"
        );


    const meta =
        eleman(
            "div",
            "gonderi-meta"
        );


    const dersEtiketi =
        eleman(
            "span",
            "ders-etiket",
            gonderi.ders || "Ders"
        );


    const tarih =
        eleman(
            "span",
            "gonderi-tarih",
            tarihFormatla(
                gonderi.created_at
            )
        );


    meta.appendChild(
        dersEtiketi
    );

    meta.appendChild(
        tarih
    );


    ust.appendChild(
        meta
    );

    kart.appendChild(
        ust
    );


    /* -----------------------------------------------------
       BAŞLIK
    ----------------------------------------------------- */

    const baslikEl =
        eleman(
            "h3",
            null,
            gonderi.baslik
        );

    kart.appendChild(
        baslikEl
    );


    /* -----------------------------------------------------
       AÇIKLAMA
    ----------------------------------------------------- */

    const aciklamaEl =
        eleman(
            "div",
            "gonderi-aciklama",
            gonderi.aciklama
        );

    kart.appendChild(
        aciklamaEl
    );


    /* -----------------------------------------------------
       ALT
    ----------------------------------------------------- */

    const alt =
        eleman(
            "div",
            "gonderi-alt"
        );


    const sahip =
        eleman(
            "span",
            "gonderi-sahip",
            "Soruyu soran: " +
            (gonderi.ad || "Kullanıcı")
        );


    const islemler =
        eleman(
            "div",
            "gonderi-islemler"
        );


    /* -----------------------------------------------------
       CEVAPLAR
    ----------------------------------------------------- */

    const cevapButonu =
        eleman(
            "button",
            "kucuk-buton cevaplari-buton",
            "Cevaplar (" +
            Number(gonderi.cevap_sayisi || 0) +
            ")"
        );

    cevapButonu.type = "button";


    const cevapAlani =
        cevapAlaniOlustur(
            gonderi
        );


    cevapButonu.addEventListener(
        "click",
        async () => {

            const acikMi =
                cevapAlani.classList.contains(
                    "acik"
                );


            if (acikMi) {

                cevapAlani.classList.remove(
                    "acik"
                );

                return;
            }


            cevapAlani.classList.add(
                "acik"
            );


            await cevaplariGetir(
                gonderi.id,
                cevapAlani
            );
        }
    );


    islemler.appendChild(
        cevapButonu
    );


    /* -----------------------------------------------------
       SİLME
    ----------------------------------------------------- */

    if (
        mevcutKullanici &&
        (
            gonderi.user_id ===
            mevcutKullanici.id
            ||
            mevcutKullaniciAdminMi
        )
    ) {

        const silButonu =
            eleman(
                "button",
                "kucuk-buton sil-buton",
                "Sil"
            );

        silButonu.type = "button";


        silButonu.addEventListener(
            "click",
            () => {

                gonderiSil(
                    gonderi.id,
                    kart
                );
            }
        );


        islemler.appendChild(
            silButonu
        );
    }


    alt.appendChild(
        sahip
    );

    alt.appendChild(
        islemler
    );

    kart.appendChild(
        alt
    );


    kart.appendChild(
        cevapAlani
    );


    return kart;
}


/* =========================================================
   CEVAP ALANI
========================================================= */

function cevapAlaniOlustur(gonderi) {

    const alan =
        eleman(
            "div",
            "cevap-alani"
        );


    const liste =
        eleman(
            "div",
            "cevap-listesi"
        );


    liste.dataset.cevapListesi =
        "true";


    alan.appendChild(
        liste
    );


    if (!mevcutKullanici) {

        const giris =
            eleman(
                "div",
                "cevap-giris"
            );


        const metin =
            document.createElement("span");


        metin.appendChild(
            document.createTextNode(
                "Cevap yazmak için "
            )
        );


        const link =
            document.createElement("a");

        link.href =
            "giris.html";

        link.textContent =
            "giriş yap";

        metin.appendChild(
            link
        );


        metin.appendChild(
            document.createTextNode(
                "malısın."
            )
        );


        giris.appendChild(
            metin
        );


        alan.appendChild(
            giris
        );


        return alan;
    }


    /* -----------------------------------------------------
       CEVAP FORMU
    ----------------------------------------------------- */

    const form =
        document.createElement("form");

    form.className =
        "cevap-form";


    const textarea =
        document.createElement("textarea");

    textarea.maxLength =
        1000;

    textarea.placeholder =
        "Bu soruya yardımcı ol...";


    const buton =
        eleman(
            "button",
            "cevap-gonder",
            "Cevapla"
        );

    buton.type =
        "submit";


    form.appendChild(
        textarea
    );

    form.appendChild(
        buton
    );


    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const metin =
                textarea.value.trim();


            if (!metin) {

                alert(
                    "Cevap boş bırakılamaz."
                );

                return;
            }


            buton.disabled =
                true;

            buton.textContent =
                "Gönderiliyor...";


            const {
                error
            } = await supabaseClient.rpc(
                "gonderi_cevap_ekle",
                {
                    p_gonderi_id:
                        gonderi.id,

                    p_cevap:
                        metin,

                    p_ust_cevap_id:
                        null
                }
            );


            if (error) {

                alert(
                    hataMetni(error)
                );

                buton.disabled =
                    false;

                buton.textContent =
                    "Cevapla";

                return;
            }


            textarea.value = "";


            await cevaplariGetir(
                gonderi.id,
                alan
            );


            buton.disabled =
                false;

            buton.textContent =
                "Cevapla";
        }
    );


    alan.appendChild(
        form
    );


    return alan;
}


/* =========================================================
   CEVAPLARI GETİR
========================================================= */

async function cevaplariGetir(
    gonderiId,
    cevapAlani
) {

    const liste =
        cevapAlani.querySelector(
            '[data-cevap-listesi="true"]'
        );


    liste.innerHTML =
        "";


    const yukleniyor =
        eleman(
            "div",
            null,
            "Cevaplar yükleniyor..."
        );


    liste.appendChild(
        yukleniyor
    );


    const {
        data,
        error
    } = await supabaseClient.rpc(
        "gonderi_cevaplarini_getir",
        {
            p_gonderi_id:
                gonderiId
        }
    );


    if (error) {

        liste.innerHTML = "";

        liste.appendChild(
            eleman(
                "div",
                null,
                "Cevaplar alınamadı: " +
                hataMetni(error)
            )
        );

        return;
    }


    liste.innerHTML = "";


    const cevaplar =
        Array.isArray(data)
            ? data
            : [];


    if (cevaplar.length === 0) {

        liste.appendChild(
            eleman(
                "div",
                null,
                "Henüz cevap yok. İlk cevabı sen verebilirsin."
            )
        );

        return;
    }


    cevaplar.forEach(
        cevap => {

            const cevapEl =
                cevapOlustur(
                    cevap
                );

            liste.appendChild(
                cevapEl
            );
        }
    );
}


/* =========================================================
   TEK CEVAP
========================================================= */

function cevapOlustur(cevap) {

    const el =
        eleman(
            "div",
            "cevap"
        );


    const ust =
        eleman(
            "div",
            "cevap-ust"
        );


    const yazar =
        eleman(
            "span",
            "cevap-yazar",
            cevap.ad || "Kullanıcı"
        );


    const tarih =
        eleman(
            "span",
            "cevap-tarih",
            tarihFormatla(
                cevap.created_at
            )
        );


    ust.appendChild(
        yazar
    );

    ust.appendChild(
        tarih
    );


    el.appendChild(
        ust
    );


    const metin =
        eleman(
            "div",
            "cevap-metin",
            cevap.cevap
        );


    el.appendChild(
        metin
    );


    /*
       Kendi cevabı veya admin ise silme.
    */

    if (
        mevcutKullanici &&
        (
            cevap.user_id ===
            mevcutKullanici.id
            ||
            mevcutKullaniciAdminMi
        )
    ) {

        const sil =
            eleman(
                "button",
                "cevap-sil",
                "Cevabı Sil"
            );

        sil.type =
            "button";


        sil.addEventListener(
            "click",
            async () => {

                const onay =
                    confirm(
                        "Bu cevabı silmek istediğine emin misin?"
                    );


                if (!onay) {
                    return;
                }


                sil.disabled =
                    true;


                const {
                    error
                } = await supabaseClient.rpc(
                    "gonderi_cevap_sil",
                    {
                        p_id:
                            cevap.id
                    }
                );


                if (error) {

                    alert(
                        hataMetni(error)
                    );

                    sil.disabled =
                        false;

                    return;
                }


                el.remove();
            }
        );


        el.appendChild(
            sil
        );
    }


    return el;
}


/* =========================================================
   GÖNDERİ SİL
========================================================= */

async function gonderiSil(
    id,
    kart
) {

    const onay =
        confirm(
            "Bu soruyu ve cevaplarını silmek istediğine emin misin?"
        );


    if (!onay) {
        return;
    }


    const {
        error
    } = await supabaseClient.rpc(
        "gonderi_sil",
        {
            p_id: id
        }
    );


    if (error) {

        alert(
            hataMetni(error)
        );

        return;
    }


    kart.remove();


    /*
       Liste tamamen boş kaldıysa
       bilgi mesajı göster.
    */

    if (
        gonderiListesi.children.length === 0
    ) {

        gonderiListesi.appendChild(
            eleman(
                "div",
                "bos-liste",
                "Henüz bu bölümde bir soru yok."
            )
        );
    }
}


/* =========================================================
   ARAMA
========================================================= */

araButonu.addEventListener(
    "click",
    async () => {

        await gonderileriGetir(
            false
        );
    }
);


/*
   Enter ile arama.
*/

filtreArama.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            araButonu.click();
        }
    }
);


/*
   Ders değişince direkt filtrele.
*/

filtreDers.addEventListener(
    "change",
    async () => {

        await gonderileriGetir(
            false
        );
    }
);


/* =========================================================
   DAHA FAZLA
========================================================= */

dahaButonu.addEventListener(
    "click",
    async () => {

        if (!dahaFazlaVar) {
            return;
        }


        dahaButonu.disabled =
            true;

        dahaButonu.textContent =
            "Yükleniyor...";


        sayfaNo++;


        await gonderileriGetir(
            true
        );


        dahaButonu.disabled =
            false;

        dahaButonu.textContent =
            "Daha Fazla";
    }
);


/* =========================================================
   AUTH DEĞİŞİKLİĞİ
========================================================= */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        const eskiId =
            mevcutKullanici?.id || null;

        const yeniId =
            session?.user?.id || null;


        mevcutKullanici =
            session?.user || null;


        /*
           Kullanıcı gerçekten değiştiyse
           butonları ve silme izinlerini yenile.
        */

        if (
            eskiId !== yeniId
        ) {

            await kullaniciyiGuncelle();

            await gonderileriGetir(false);
        }
    }
);


/* =========================================================
   BAŞLAT
========================================================= */

async function baslat() {

    await kullaniciyiGuncelle();

    await dersListesiniGetir();

    await gonderileriGetir(false);
}


baslat();

<script>
/* Paylaşım formu başta kapalı; düğme açıp kapatır.
   Form DOM'da kalır, sayfanın kendi kodu aynen çalışır. */
(function () {
    var d = document.getElementById("formAcButonu");
    var k = document.getElementById("formKarti");
    var y = document.getElementById("formAcYazi");
    if (!d || !k || !y) { return; }

    d.addEventListener("click", function () {
        var ac = !k.classList.contains("form-acik");
        k.classList.toggle("form-acik", ac);
        d.setAttribute("aria-expanded", ac ? "true" : "false");
        y.textContent = ac ? y.getAttribute("data-acik") : y.getAttribute("data-kapali");
        if (ac) {
            k.scrollIntoView({ behavior: "smooth", block: "start" });
            var ilk = k.querySelector("select, input:not([type=hidden]), textarea");
            if (ilk) { ilk.focus({ preventScroll: true }); }
        }
    });
})();
</script>
