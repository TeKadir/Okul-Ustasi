<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ders Yardımı - Okul Ustası</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="ders-yardimi.css">

<!-- Ortak tema + panel (ortak.css / ortak.js) -->
<script>
/* Tema tercihi sayfa çizilmeden ÖNCE uygulanır (beyaz parlama olmaz). */
try {
    if (localStorage.getItem("ou-tema") === "dark") {
        document.documentElement.setAttribute("data-tema", "dark");
    }
} catch (e) {}
</script>
<link rel="stylesheet" href="ortak.css">
</head>

<body class="ou-hatli">

    <!-- =====================================================
     ÜST MENÜ (tüm sayfalarda aynı)
===================================================== -->
<header class="ou-ust">

    <div class="ou-sol">
        <button type="button" class="ou-panel-ac" id="ouPanelAc"
                aria-label="Menüyü aç" aria-expanded="false" aria-controls="ouPanel">
            <span class="ou-ikon" aria-hidden="true"></span>
            <span class="ou-panel-ac-yazi">Panel</span>
        </button>
        <a class="ou-marka" href="anasayfa.html">Okul Ustası</a>
    </div>

    <div class="ou-sag">
        <a class="ou-giris" id="topLoginLink" href="giris.html">Giriş Yap</a>

        <div id="topUser">
            <span id="topUserEmail"></span>
            <button type="button" class="ou-cikis" id="logoutButton">Çıkış</button>
        </div>

        <button type="button" class="ou-tema" id="ouTemaDugme"
                aria-label="Karanlık temaya geç"></button>
    </div>

</header>


    <main class="sayfa">

        <!-- =================================================
             BAŞLIK
        ================================================= -->

        <section class="baslik-alani">

            <h1>Ders Yardımı</h1>

            <p>
                Takıldığın bir konuyu sor, bilen arkadaşların yardımcı olsun.
            </p>

        </section>


        <!-- =================================================
             GÖNDERİ FORMU
        ================================================= -->

        <!-- Form varsayılan olarak kapalı; bu düğmeyle açılır -->
        <div class="form-ac-satir">
            <button type="button" class="form-ac-buton" id="formAcButonu"
                    aria-expanded="false" aria-controls="formKarti">
                <svg class="ou-svg ac-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <svg class="ou-svg kapa-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
                <span id="formAcYazi" data-kapali="Yeni soru sor" data-acik="Formu kapat">Yeni soru sor</span>
            </button>
        </div>

        <section class="form-karti form-gizli" id="formKarti">

            <h2>Bir şey mi soracaksın?</h2>

            <div
                id="girisUyarisi"
                class="giris-uyarisi"
                style="display:none;">

                Ders Yardımı'na soru göndermek için
                <a href="giris.html">giriş yapman gerekiyor.</a>

            </div>


            <form id="gonderiFormu">

                <div class="form-grid">

                    <div class="alan">

                        <label for="ders">
                            Ders
                        </label>

                        <select id="ders" required>

                            <option value="">
                                Ders seç
                            </option>

                        </select>

                    </div>


                    <div class="alan">

                        <label for="baslik">
                            Başlık
                        </label>

                        <input
                            id="baslik"
                            type="text"
                            maxlength="150"
                            placeholder="Örn: Üslü sayılarda burada takıldım"
                            required>

                    </div>


                    <div class="alan tam-alan">

                        <label for="aciklama">
                            Sorun / Açıklama
                        </label>

                        <textarea
                            id="aciklama"
                            maxlength="2000"
                            placeholder="Nerede takıldığını veya neyi anlamadığını anlat..."
                            required></textarea>

                    </div>

                </div>


                <div class="form-alt">

                    <span
                        id="karakterSayisi"
                        class="karakter">
                        0 / 2000
                    </span>

                    <button
                        id="gonderButonu"
                        class="gonder-buton"
                        type="submit">
                        Yardım İste
                    </button>

                </div>


                <div
                    id="formMesaji"
                    class="mesaj">
                </div>

            </form>

        </section>


        <!-- =================================================
             FİLTRE
        ================================================= -->

        <section class="filtre-karti">

            <select id="filtreDers">

                <option value="">
                    Tüm dersler
                </option>

            </select>


            <input
                id="filtreArama"
                type="search"
                maxlength="100"
                placeholder="Başlık veya açıklamada ara...">


            <button
                id="araButonu"
                class="ara-buton">
                Ara
            </button>

        </section>


        <!-- =================================================
             LİSTE
        ================================================= -->

        <section>

            <div class="liste-baslik">

                <h2>Sorular</h2>

                <span id="listeDurumu"></span>

            </div>


            <div
                id="gonderiListesi">

                <div class="yukleniyor">
                    Sorular yükleniyor...
                </div>

            </div>


            <div class="sayfalama">

                <button
                    id="dahaButonu"
                    class="daha-buton"
                    style="display:none;">
                    Daha Fazla
                </button>

            </div>

        </section>

    </main>


<script src="ders-yardimi.js"></script>


<script src="form-ac.js"></script>
<script src="ortak.js"></script>

</body>
</html>
