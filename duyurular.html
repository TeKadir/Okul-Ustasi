<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duyurular - Okul Ustası</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        repeating-linear-gradient(
            to bottom,
            #fffdf5 0px,
            #fffdf5 31px,
            #c9d8e6 32px
        );
    font-family: "Comic Sans MS", "Segoe Print", cursive;
    color: #222;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    left: 45px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #e88989;
    opacity: 0.8;
    pointer-events: none;
}

.container {
    width: min(900px, calc(100% - 70px));
    margin: 35px auto;
    padding: 25px 35px 40px 55px;
}

h1 {
    text-align: center;
    font-size: clamp(25px, 5vw, 42px);
    margin-bottom: 15px;
    transform: rotate(-1deg);
}

h2 {
    font-size: 25px;
    margin-bottom: 10px;
}

h3 {
    margin-bottom: 12px;
}

p {
    font-size: 18px;
    line-height: 1.7;
}

.card {
    background: rgba(255, 255, 250, 0.75);
    border: 2px solid #333;
    border-radius: 8px;
    padding: 20px;
    margin: 25px 0;
    box-shadow: 4px 4px 0 #555;
}

/* =========================================================
   DUYURU KUTUSU
========================================================= */

.duyuru {
    background: rgba(255, 255, 250, 0.75);
    border: 2px solid #333;
    border-radius: 20px;
    padding: 20px;
    margin: 25px auto;
    box-shadow: 4px 4px 0 #555;
    width: min(700px, 100%);
}

.duyuru h2 {
    margin-top: 0;
}

.duyuru-tarih {
    color: #666;
    font-size: 15px;
    margin-bottom: 12px;
}

.duyuru-aciklama {
    margin-bottom: 0;
    white-space: pre-wrap;
}

/* =========================================================
   BUTONLAR
========================================================= */

.main-button {
    display: inline-block;
    background: #fff19a;
    border: 2px solid #222;
    box-shadow: 3px 3px 0 #555;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
    text-decoration: none;
    color: #222;
    transition: 0.15s;
}

.main-button:hover {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #555;
}

.secondary-button {
    background: #fff;
    display: inline-block;
    border: 2px solid #333;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    margin: 4px;
}

.secondary-button:hover {
    background: #eee;
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

/* =========================================================
   ÜST ÇUBUK
========================================================= */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 20px 0 20px;
}

.topbar-left,
.topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

#topUser {
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

#topUserEmail {
    font-size: 14px;
    color: #555;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================================================
   FORM
========================================================= */

.form-group {
    margin-bottom: 15px;
}

.form-label {
    display: block;
    font-size: 16px;
    margin-bottom: 5px;
}

.input {
    width: 100%;
    padding: 11px;
    border: 2px solid #333;
    background: #fff;
    font-family: inherit;
    font-size: 16px;
}

textarea.input {
    min-height: 120px;
    resize: vertical;
}

.form-message {
    margin-top: 12px;
    font-size: 15px;
    min-height: 22px;
}

.small-note {
    font-size: 14px;
    color: #666;
    margin-top: 15px;
}

/* =========================================================
   ADMIN
========================================================= */

#adminPanel {
    display: none;
}

#adminControls {
    display: none;
}

.admin-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 2px dashed #777;
}

.event-form-box {
    background: #fff;
    border: 2px dashed #333;
    padding: 18px;
    margin: 15px 0 25px 0;
}

.admin-duyuru {
    background: #fff;
    border: 2px solid #333;
    padding: 15px;
    margin: 15px 0;
    box-shadow: 3px 3px 0 #777;
}

.admin-duyuru strong {
    font-size: 19px;
}

.admin-duyuru-aciklama {
    margin: 10px 0 12px 0;
    white-space: pre-wrap;
    line-height: 1.6;
}

footer {
    text-align: center;
    margin-top: 35px;
    font-size: 13px;
    color: #777;
}

@media (max-width: 600px) {

    body::before {
        left: 20px;
    }

    .container {
        width: calc(100% - 30px);
        padding: 20px 15px 30px 30px;
        margin: 20px auto;
    }

    p {
        font-size: 16px;
    }

    h2 {
        font-size: 22px;
    }

    .topbar {
        padding: 10px 12px 0 30px;
    }

    #topUserEmail {
        max-width: 140px;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     ÜST ÇUBUK
===================================================== -->

<div class="topbar">

    <div class="topbar-left">

        <a
            href="anasayfa.html"
            class="secondary-button"
        >
            ← Ana Sayfa
        </a>

    </div>

    <div class="topbar-right">

        <a
            class="main-button"
            id="topLoginLink"
            href="giris.html"
        >
            Giriş Yap
        </a>

        <div id="topUser">

            <span id="topUserEmail"></span>

            <button
                class="secondary-button"
                id="logoutButton"
            >
                Çıkış Yap
            </button>

        </div>

    </div>

</div>


<div class="container">

    <div class="card">

        <h1>
            Duyurular
        </h1>

        <p>
            Okul ile ilgili önemli etkinlikler ve duyurular burada yayınlanır.
        </p>

    </div>


    <!-- =====================================================
         DUYURU LİSTESİ
    ====================================================== -->

    <div id="duyuruListesi">
        Duyurular yükleniyor...
    </div>


    <!-- =====================================================
         ADMIN PANELİ
    ====================================================== -->

    <div
        class="card"
        id="adminPanel"
    >

        <h2>
            Yönetici Paneli
        </h2>


        <div id="adminLoginBox">

            <div class="form-group">

                <label
                    class="form-label"
                    for="adminEmail"
                >
                    Yönetici e-postası
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    class="input"
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="adminPassword"
                >
                    Yönetici şifresi
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    class="input"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="main-button"
                id="adminLoginButton"
            >
                Yönetici Girişi
            </button>


            <div
                id="adminMessage"
                class="form-message"
            ></div>

        </div>


        <div id="adminControls">

            <div class="admin-section">

                <h2 id="duyuruFormTitle">
                    Yeni Duyuru Ekle
                </h2>


                <div class="event-form-box">

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="duyuruBaslikInput"
                        >
                            Duyuru başlığı
                        </label>

                        <input
                            type="text"
                            id="duyuruBaslikInput"
                            class="input"
                            maxlength="200"
                            placeholder="Duyuru başlığı"
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="duyuruTarihInput"
                        >
                            Duyuru tarihi
                        </label>

                        <input
                            type="date"
                            id="duyuruTarihInput"
                            class="input"
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="duyuruAciklamaInput"
                        >
                            Duyuru açıklaması
                        </label>

                        <textarea
                            id="duyuruAciklamaInput"
                            class="input"
                            maxlength="5000"
                            placeholder="Duyuru açıklaması"
                        ></textarea>

                    </div>


                    <button
                        class="main-button"
                        id="saveDuyuruButton"
                    >
                        Duyuruyu Kaydet
                    </button>


                    <button
                        class="secondary-button"
                        id="cancelDuyuruButton"
                        style="display:none;"
                    >
                        Düzenlemeyi İptal Et
                    </button>


                    <div
                        id="duyuruMessage"
                        class="form-message"
                    ></div>

                </div>


                <h3>
                    Kayıtlı Duyurular
                </h3>


                <div id="adminDuyuruList">
                    Duyurular yükleniyor...
                </div>

            </div>


            <button
                class="secondary-button"
                id="adminLogoutButton"
            >
                Yönetici Çıkışı
            </button>

        </div>

    </div>


    <footer>
        Okul Ustası
    </footer>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://hinisayolrgyzcoztobi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_76n3XsryMfvfdYwKeUu6SA_TCxImZiW";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   ELEMENTLER
========================================================= */

const topLoginLink =
    document.getElementById("topLoginLink");

const topUser =
    document.getElementById("topUser");

const topUserEmail =
    document.getElementById("topUserEmail");

const logoutButton =
    document.getElementById("logoutButton");

const duyuruListesi =
    document.getElementById("duyuruListesi");

const adminPanel =
    document.getElementById("adminPanel");

const adminLoginBox =
    document.getElementById("adminLoginBox");

const adminControls =
    document.getElementById("adminControls");

const adminEmail =
    document.getElementById("adminEmail");

const adminPassword =
    document.getElementById("adminPassword");

const adminLoginButton =
    document.getElementById("adminLoginButton");

const adminMessage =
    document.getElementById("adminMessage");

const adminDuyuruList =
    document.getElementById("adminDuyuruList");

const duyuruBaslikInput =
    document.getElementById("duyuruBaslikInput");

const duyuruAciklamaInput =
    document.getElementById("duyuruAciklamaInput");

const duyuruTarihInput =
    document.getElementById("duyuruTarihInput");

const duyuruFormTitle =
    document.getElementById("duyuruFormTitle");

const saveDuyuruButton =
    document.getElementById("saveDuyuruButton");

const cancelDuyuruButton =
    document.getElementById("cancelDuyuruButton");

const duyuruMessage =
    document.getElementById("duyuruMessage");

const adminLogoutButton =
    document.getElementById("adminLogoutButton");


/* =========================================================
   DURUM
========================================================= */

let duzenlenenDuyuruId = null;


/* =========================================================
   ÜST ÇUBUK
========================================================= */

function ustCubuguGuncelle(session) {

    if (session && session.user) {

        topLoginLink.style.display = "none";
        topUser.style.display = "flex";
        topUserEmail.textContent = session.user.email || "";

    } else {

        topLoginLink.style.display = "inline-block";
        topUser.style.display = "none";
        topUserEmail.textContent = "";

    }
}


logoutButton.addEventListener(
    "click",
    async function () {

        const { error } =
            await supabaseClient.auth.signOut();

        if (error) {
            console.error("Çıkış yapılamadı:", error);
        }

    }
);


supabaseClient.auth.onAuthStateChange(
    function (event, session) {
        ustCubuguGuncelle(session);
    }
);


supabaseClient.auth.getSession().then(
    function (result) {
        ustCubuguGuncelle(result.data.session);
    }
);


/* =========================================================
   TARİH FORMATLAMA
========================================================= */

function tarihiFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    const parcalar = tarih.split("-");

    if (parcalar.length !== 3) {
        return tarih;
    }

    return (
        parcalar[2] +
        "." +
        parcalar[1] +
        "." +
        parcalar[0]
    );
}


/* =========================================================
   DUYURULARI GETİR
========================================================= */

async function duyurulariGetir() {

    duyuruListesi.textContent =
        "Duyurular yükleniyor...";

    const {
        data,
        error
    } = await supabaseClient
        .rpc("duyurulari_getir");


    if (error) {

        console.error(
            "Duyurular alınamadı:",
            error
        );

        duyuruListesi.textContent =
            "Duyurular şu anda yüklenemiyor.";

        return [];
    }


    if (!data || data.length === 0) {

        duyuruListesi.textContent =
            "Henüz yayınlanmış bir duyuru yok.";

        return [];
    }


    duyuruListesi.innerHTML = "";


    data.forEach(function (duyuru) {

        const kutu =
            document.createElement("div");

        kutu.className = "duyuru";


        const baslik =
            document.createElement("h2");

        baslik.textContent =
            duyuru.baslik;


        const tarih =
            document.createElement("div");

        tarih.className = "duyuru-tarih";

        tarih.textContent =
            "Tarih: " +
            tarihiFormatla(duyuru.tarih);


        const aciklama =
            document.createElement("p");

        aciklama.className = "duyuru-aciklama";

        aciklama.textContent =
            duyuru.aciklama;


        kutu.appendChild(baslik);
        kutu.appendChild(tarih);
        kutu.appendChild(aciklama);

        duyuruListesi.appendChild(kutu);

    });


    return data;
}


/* =========================================================
   ADMIN KONTROLÜ
========================================================= */

async function adminMi() {

    const {
        data,
        error
    } = await supabaseClient
        .rpc("is_admin");


    if (error) {

        console.error(
            "Admin kontrolü başarısız:",
            error
        );

        return false;
    }


    return data === true;
}


/* =========================================================
   ADMIN PANELİ
========================================================= */

function adminPaneliniKontrolEt() {

    if (
        window.location.hash.toLowerCase() === "#admin"
    ) {

        adminPanel.style.display = "block";

    } else {

        adminPanel.style.display = "none";
        adminControls.style.display = "none";
        adminLoginBox.style.display = "block";

    }
}


/* =========================================================
   ADMIN GİRİŞ
========================================================= */

async function adminGiris() {

    const email =
        adminEmail.value.trim();

    const password =
        adminPassword.value;


    adminMessage.textContent = "";


    if (!email || !password) {

        adminMessage.textContent =
            "E-posta ve şifre gir.";

        return;
    }


    adminMessage.textContent =
        "Giriş yapılıyor...";

    adminLoginButton.disabled = true;


    const {
        error
    } = await supabaseClient
        .auth
        .signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        adminMessage.textContent =
            "Giriş başarısız: " +
            error.message;

        adminLoginButton.disabled = false;
        return;
    }


    const yetkili =
        await adminMi();


    if (!yetkili) {

        await supabaseClient.auth.signOut();

        adminMessage.textContent =
            "Bu hesap yönetici olarak yetkilendirilmemiş.";

        adminLoginButton.disabled = false;
        return;
    }


    adminLoginBox.style.display = "none";
    adminControls.style.display = "block";
    adminMessage.textContent = "";
    adminLoginButton.disabled = false;


    await adminDuyurulariGetir();
}


/* =========================================================
   ADMIN DUYURULARINI GETİR
========================================================= */

async function adminDuyurulariGetir() {

    adminDuyuruList.textContent =
        "Duyurular yükleniyor...";


    const {
        data,
        error
    } = await supabaseClient
        .rpc("duyurulari_getir");


    if (error) {

        adminDuyuruList.textContent =
            "Duyurular alınamadı.";

        console.error(error);
        return;
    }


    if (!data || data.length === 0) {

        adminDuyuruList.textContent =
            "Henüz duyuru yok.";

        return;
    }


    adminDuyuruList.innerHTML = "";


    data.forEach(function (duyuru) {

        const kutu =
            document.createElement("div");

        kutu.className = "admin-duyuru";


        const baslik =
            document.createElement("strong");

        baslik.textContent =
            duyuru.baslik;


        const tarih =
            document.createElement("div");

        tarih.className = "duyuru-tarih";

        tarih.textContent =
            "Tarih: " +
            tarihiFormatla(duyuru.tarih);


        const aciklama =
            document.createElement("div");

        aciklama.className =
            "admin-duyuru-aciklama";

        aciklama.textContent =
            duyuru.aciklama;


        const duzenleButton =
            document.createElement("button");

        duzenleButton.className =
            "secondary-button";

        duzenleButton.textContent =
            "Düzenle";

        duzenleButton.addEventListener(
            "click",
            function () {
                duyuruDuzenle(duyuru);
            }
        );


        const silButton =
            document.createElement("button");

        silButton.className =
            "secondary-button";

        silButton.textContent =
            "Sil";

        silButton.addEventListener(
            "click",
            function () {
                duyuruSil(duyuru.id);
            }
        );


        kutu.appendChild(baslik);
        kutu.appendChild(tarih);
        kutu.appendChild(aciklama);
        kutu.appendChild(duzenleButton);
        kutu.appendChild(silButton);

        adminDuyuruList.appendChild(kutu);

    });
}


/* =========================================================
   DUYURU EKLE / GÜNCELLE
========================================================= */

async function duyuruKaydet() {

    const baslik =
        duyuruBaslikInput.value.trim();

    const aciklama =
        duyuruAciklamaInput.value.trim();

    const tarih =
        duyuruTarihInput.value;


    duyuruMessage.textContent = "";


    if (!baslik) {
        duyuruMessage.textContent =
            "Duyuru başlığı gir.";
        return;
    }


    if (!aciklama) {
        duyuruMessage.textContent =
            "Duyuru açıklaması gir.";
        return;
    }


    if (!tarih) {
        duyuruMessage.textContent =
            "Duyuru tarihi seç.";
        return;
    }


    saveDuyuruButton.disabled = true;

    duyuruMessage.textContent =
        "Kaydediliyor...";


    let error = null;


    if (duzenlenenDuyuruId === null) {

        const result =
            await supabaseClient
                .rpc("duyuru_ekle", {
                    p_baslik: baslik,
                    p_aciklama: aciklama,
                    p_tarih: tarih
                });

        error = result.error;

    } else {

        const result =
            await supabaseClient
                .rpc("duyuru_guncelle", {
                    p_id: duzenlenenDuyuruId,
                    p_baslik: baslik,
                    p_aciklama: aciklama,
                    p_tarih: tarih
                });

        error = result.error;
    }


    if (error) {

        console.error(
            "Duyuru kaydedilemedi:",
            error
        );

        duyuruMessage.textContent =
            "Duyuru kaydedilemedi: " +
            error.message;

        saveDuyuruButton.disabled = false;
        return;
    }


    duyuruMessage.textContent =
        duzenlenenDuyuruId === null
            ? "Duyuru başarıyla eklendi."
            : "Duyuru başarıyla güncellendi.";


    duyuruDuzenlemeyiIptalEt();

    await duyurulariGetir();
    await adminDuyurulariGetir();

    saveDuyuruButton.disabled = false;
}


/* =========================================================
   DUYURU DÜZENLE
========================================================= */

function duyuruDuzenle(duyuru) {

    duzenlenenDuyuruId =
        duyuru.id;

    duyuruFormTitle.textContent =
        "Duyuruyu Düzenle";

    saveDuyuruButton.textContent =
        "Değişiklikleri Kaydet";

    cancelDuyuruButton.style.display =
        "inline-block";

    duyuruBaslikInput.value =
        duyuru.baslik;

    duyuruAciklamaInput.value =
        duyuru.aciklama;

    duyuruTarihInput.value =
        duyuru.tarih;

    duyuruMessage.textContent =
        "";

    duyuruBaslikInput.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}


/* =========================================================
   DÜZENLEMEYİ İPTAL
========================================================= */

function duyuruDuzenlemeyiIptalEt() {

    duzenlenenDuyuruId = null;

    duyuruFormTitle.textContent =
        "Yeni Duyuru Ekle";

    saveDuyuruButton.textContent =
        "Duyuruyu Kaydet";

    cancelDuyuruButton.style.display =
        "none";

    duyuruBaslikInput.value = "";
    duyuruAciklamaInput.value = "";
    duyuruTarihInput.value = "";
}


/* =========================================================
   DUYURU SİL
========================================================= */

async function duyuruSil(id) {

    const onay =
        confirm(
            "Bu duyuru kalıcı olarak silinsin mi?"
        );


    if (!onay) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .rpc("duyuru_sil", {
            p_id: id
        });


    if (error) {

        console.error(
            "Duyuru silinemedi:",
            error
        );

        alert(
            "Duyuru silinemedi: " +
            error.message
        );

        return;
    }


    await duyurulariGetir();
    await adminDuyurulariGetir();
}


/* =========================================================
   ADMIN ÇIKIŞ
========================================================= */

async function adminCikis() {

    await supabaseClient
        .auth
        .signOut();

    adminControls.style.display =
        "none";

    adminLoginBox.style.display =
        "block";

    adminEmail.value = "";
    adminPassword.value = "";

    adminMessage.textContent =
        "Yönetici çıkışı yapıldı.";
}


/* =========================================================
   BUTONLAR
========================================================= */

adminLoginButton.addEventListener(
    "click",
    adminGiris
);

saveDuyuruButton.addEventListener(
    "click",
    duyuruKaydet
);

cancelDuyuruButton.addEventListener(
    "click",
    duyuruDuzenlemeyiIptalEt
);

adminLogoutButton.addEventListener(
    "click",
    adminCikis
);


/* =========================================================
   BAŞLANGIÇ
========================================================= */

async function baslat() {

    adminPaneliniKontrolEt();

    await duyurulariGetir();


    if (
        window.location.hash.toLowerCase() !== "#admin"
    ) {
        return;
    }


    const {
        data: {
            session
        }
    } = await supabaseClient
        .auth
        .getSession();


    if (!session) {
        return;
    }


    const yetkili =
        await adminMi();


    if (yetkili) {

        adminLoginBox.style.display =
            "none";

        adminControls.style.display =
            "block";

        await adminDuyurulariGetir();
    }
}


baslat();


/* =========================================================
   HASH DEĞİŞİNCE
========================================================= */

window.addEventListener(
    "hashchange",
    async function () {

        adminPaneliniKontrolEt();


        if (
            window.location.hash.toLowerCase() !== "#admin"
        ) {
            return;
        }


        const {
            data: {
                session
            }
        } = await supabaseClient
            .auth
            .getSession();


        if (!session) {
            return;
        }


        const yetkili =
            await adminMi();


        if (yetkili) {

            adminLoginBox.style.display =
                "none";

            adminControls.style.display =
                "block";

            await adminDuyurulariGetir();
        }
    }
);


/* =========================================================
   OTOMATİK YENİLEME
========================================================= */

setInterval(
    duyurulariGetir,
    30000
);

</script>
